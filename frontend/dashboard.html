<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OphthaScreen · Fundus Screening</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--pri:#4f46e5;--pri2:#0ea5e9;
--ok:#047857;--okbg:#d1fae5;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--mutedbg:#eef1f7;
--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#121a2f;--ink:#e6eaf5;--muted:#93a0bd;--line:#1f2a47;
--ok:#6ee7b7;--okbg:#064e3b;--warn:#fcd34d;--warnbg:#4a3206;--bad:#fca5a5;--badbg:#4c1313;--info:#93c5fd;--infobg:#172554;--mutedbg:#1a2340;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25}h2{font-size:1.35rem}h3{font-size:1.05rem}h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:.25rem 0 .75rem}.muted{color:var(--muted)}.small{font-size:.85rem}.right{text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:.55rem .95rem;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.btn.pri:hover{filter:brightness(1.08);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.btn.sm{padding:.3rem .65rem;font-size:.85rem}
.link{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;margin-bottom:.75rem}
input,select,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
label.f{display:block;margin-bottom:.85rem;font-size:.85rem;font-weight:600;color:var(--muted)}label.f>*:not(span){margin-top:.3rem;font-weight:400;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1rem}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
/* header / nav */
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.5rem;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.1rem}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff}
.who{display:flex;align-items:center;gap:.75rem}.chip{background:var(--mutedbg);padding:.25rem .7rem;border-radius:99px;font-size:.85rem}
.wrap{max-width:1200px;margin:0 auto;padding:1.25rem}
nav.tabs{display:flex;gap:.4rem;margin-bottom:1.25rem;flex-wrap:wrap}nav.tabs button{border:0;background:transparent;padding:.55rem 1rem;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
footer{max-width:1200px;margin:0 auto;padding:1rem 1.25rem 2rem;color:var(--muted);font-size:.8rem}
/* badges */
.badge{display:inline-block;padding:.12rem .6rem;border-radius:99px;font-size:.75rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.info{background:var(--infobg);color:var(--info)}.badge.muted{background:var(--mutedbg);color:var(--muted)}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(145deg,#312e81,#0369a1);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:2.2rem}.hero li{margin:.5rem 0;opacity:.92}.hero ul{padding-left:1.1rem}
.authcard{padding:3rem;display:flex;flex-direction:column;justify-content:center;max-width:480px;width:100%;margin:0 auto}
.tabs2{display:flex;gap:.4rem;background:var(--mutedbg);padding:.3rem;border-radius:12px;margin-bottom:1.25rem}.tabs2 button{flex:1;border:0;background:none;padding:.55rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
details.srv{margin-top:1rem;color:var(--muted);font-size:.85rem}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:2rem}.authcard{padding:2rem 1.25rem}}
/* summary cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left}
.stat:hover{transform:translateY(-2px);border-color:var(--pri)}.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{color:var(--muted);font-size:.8rem}
.stat.on{outline:2px solid var(--pri)}
/* table */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.55rem .75rem;border-bottom:1px solid var(--line)}
td{padding:.7rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:var(--mutedbg)}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.filters>*{width:auto;min-width:130px}.filters input[type=search]{flex:1;min-width:200px}
.pager{display:flex;gap:.75rem;align-items:center;justify-content:flex-end;margin-top:.9rem;color:var(--muted);font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
/* bars */
.bar{position:relative;height:10px;border-radius:99px;background:var(--mutedbg);overflow:visible}.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri2)}
.bar>i.hi{background:linear-gradient(90deg,#f59e0b,#ef4444)}.bar.sm{width:90px;height:8px}.bar.big{height:14px;margin:1.4rem 0 1.6rem}
.bar>b{position:absolute;top:-5px;width:2px;height:24px;background:var(--ink)}.bar>b em{position:absolute;top:26px;left:-30px;width:62px;text-align:center;font-style:normal;font-size:.68rem;color:var(--muted);font-weight:600}
.rk{display:flex;align-items:center;gap:.5rem;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
/* dropzone */
.dz{display:block;border:2px dashed var(--line);border-radius:var(--r);min-height:200px;cursor:pointer;position:relative;overflow:hidden;transition:.15s;background:var(--card)}
.dz:hover,.dz.over{border-color:var(--pri);background:var(--mutedbg)}.dzin{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;color:var(--muted)}
.dz .prev{width:100%;height:200px;object-fit:contain;background:#000;display:block}
.thumb{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0b0b0f;border-radius:10px;display:block}
.tile{border:1px solid var(--line);border-radius:12px;padding:.8rem;background:var(--card)}.tile.add{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5rem;color:var(--muted);border-style:dashed;min-height:180px}
.issues{margin:.4rem 0 0;padding-left:1.1rem;font-size:.85rem;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:20;overflow:auto;padding:2rem 1rem;backdrop-filter:blur(3px)}
.sheet{max-width:1100px;margin:0 auto;background:var(--bg);border-radius:18px;padding:1.5rem;position:relative}
.x{position:absolute;right:1rem;top:1rem;border:0;background:var(--card);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;box-shadow:var(--shadow)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.25rem}@media(max-width:900px){.split{grid-template-columns:1fr}}
.notice{background:var(--warnbg);color:var(--warn);padding:.6rem .8rem;border-radius:10px;font-size:.82rem;margin:.75rem 0}
.dis{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 60px;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
.review{border-left:3px solid var(--pri);padding:.4rem .8rem;margin:.5rem 0;background:var(--card);border-radius:0 8px 8px 0}
.big-n{font-size:2.4rem;font-weight:800;line-height:1}
.tier{display:inline-block;font-size:1.5rem;font-weight:800;padding:.2rem .9rem;border-radius:12px}.tier.ok{background:var(--okbg);color:var(--ok)}.tier.warn{background:var(--warnbg);color:var(--warn)}.tier.bad{background:var(--badbg);color:var(--bad)}.tier.muted{background:var(--mutedbg);color:var(--muted)}
.eyeblk{border:1px solid var(--line);border-radius:12px;padding:.8rem;margin:.6rem 0;background:var(--card)}.eyeblk h5{margin:0 0 .4rem;font-size:.95rem}
ol.path{padding-left:1.2rem;margin:.3rem 0;font-size:.85rem}ol.path li{margin:.2rem 0}ul.plain{padding-left:1.1rem;margin:.3rem 0;font-size:.85rem}
.clsec{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin:.8rem 0}.clsec>strong{display:block;margin-bottom:.5rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--mutedbg),var(--card),var(--mutedbg));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:1rem}@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;right:1rem;bottom:1rem;z-index:50;display:flex;flex-direction:column;gap:.5rem}.t{padding:.7rem 1rem;border-radius:10px;color:#fff;box-shadow:var(--shadow);max-width:360px;font-size:.9rem}.t.ok{background:#047857}.t.err{background:#b91c1c}
/* ===== OphthaScreen UX layer: calm clinical palette, worklist, case viewer, explanations ===== */
:root{--pri:#1d4ed8;--pri2:#1d4ed8;--r:10px;--shadow:0 1px 2px rgba(15,23,42,.05)}
.wrap{max-width:1440px}.logo{background:var(--pri)!important}.btn.pri{background:var(--pri)!important}
.card.flush{padding:0;overflow:hidden}.sub{font-size:.8rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;text-align:left;cursor:pointer}
.kpi b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:.8rem}
.kpi.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.toolbar input{flex:1;min-width:180px;width:auto}.toolbar select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:.4rem .8rem;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--card)}.seg button span{opacity:.6;margin-left:.2rem}
table.wl th,table.wl td{padding:.65rem 1rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#94a3b8}.dot.r{background:#dc2626}.dot.a{background:#d97706}.dot.g{background:#16a34a}
.cell{display:inline-flex;align-items:center;gap:.4rem;font-variant-numeric:tabular-nums;font-weight:600}.cell.muted{font-weight:400}
.chev{color:var(--muted);text-align:right;width:1rem}
.legend{display:flex;gap:1rem;padding:.55rem 1rem;font-size:.78rem;color:var(--muted);align-items:center;flex-wrap:wrap}.legend span{display:inline-flex;gap:.35rem;align-items:center}
/* case workspace */
.case{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr);gap:1rem;align-items:start}
@media(max-width:1000px){.case{grid-template-columns:1fr}}
.viewer{background:#0b0e14;border-radius:12px;padding:.75rem;color:#cbd5e1}
.vbar{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.vbar select{width:auto;background:#151a24;color:#e2e8f0;border-color:#263044}
.viewer .seg{background:#151a24;border-color:#263044}.viewer .seg button{color:#94a3b8}.viewer .seg button.on{background:#e2e8f0;color:#0b0e14}
.viewer .sub{color:#94a3b8;margin:.6rem 0 0}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.pane{position:relative;aspect-ratio:1;background:#000;border-radius:8px;overflow:hidden;cursor:zoom-in;border:1px solid #1c2433}.pane.z{cursor:zoom-out}
.pane img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .12s}.pane.z img{transform:scale(2.4)}
.pane.empty{display:grid;place-items:center;color:#64748b;cursor:default}
.tag,.qtag{position:absolute;z-index:2;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:6px;background:rgba(11,14,20,.8);color:#e2e8f0;letter-spacing:.03em}
.tag{top:.5rem;left:.5rem}.qtag{bottom:.5rem;left:.5rem;display:flex;gap:.35rem;align-items:center}
.pane .note{position:absolute;z-index:2;top:.5rem;right:.5rem;max-width:55%;font-size:.72rem;padding:.3rem .5rem;border-radius:6px;background:rgba(120,53,15,.9);color:#fde68a}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem}
.side .tabs{display:flex;width:100%}.side .tabs button{flex:1;padding:.4rem .3rem}
.tp{display:none;margin-top:.9rem}.tp.on{display:block}
.eyeb{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin-bottom:.7rem}
.eh{display:flex;gap:.5rem;align-items:center;margin-bottom:.4rem}.eh b{margin-right:auto}
.big{font-size:1.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.big small{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:.5rem}
.gauge{position:relative;height:8px;border-radius:99px;background:var(--mutedbg);margin:.6rem 0 .3rem}
.gauge>i{display:block;height:100%;border-radius:99px;background:var(--pri)}.gauge>i.hi{background:#dc2626}
.gauge>b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);opacity:.7}
.flow{display:flex;align-items:center;gap:.6rem;margin:.4rem 0 .7rem}.flow>div{display:flex;flex-direction:column;gap:.2rem}
.flow small{font-size:.7rem;color:var(--muted)}.flow>i{font-style:normal;color:var(--muted)}
.dm{display:grid;grid-template-columns:7.5rem 1fr 2.6rem;gap:.5rem;align-items:center;font-size:.8rem}.dm .gauge{margin:.25rem 0}
ul.fac{list-style:none;padding:0;margin:.5rem 0 0;font-size:.82rem}
ul.fac li{display:grid;grid-template-columns:1.4rem 1fr auto;gap:.5rem;padding:.25rem 0;border-top:1px solid var(--line)}
.ev{display:inline-grid;place-items:center;width:1.2rem;height:1.2rem;border-radius:4px;font-size:.68rem;font-weight:800}
.ev.V{background:var(--okbg);color:var(--ok)}.ev.R{background:var(--infobg);color:var(--info)}.ev.H{background:var(--warnbg);color:var(--warn)}
table.kv{width:100%;font-size:.85rem}table.kv td.abn{color:var(--bad);font-weight:700}
.rev{border-left:3px solid var(--pri);padding:.3rem .7rem;margin:.4rem 0;font-size:.85rem}
/* patient-facing explanation */
.steps{display:flex;gap:1.2rem;list-style:none;padding:0;margin:.75rem 0;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.steps li::before{content:"○ "}.steps li.done{color:var(--ok);font-weight:600}.steps li.done::before{content:"✓ "}
.pexp{border-top:1px solid var(--line);margin-top:1rem;padding-top:.8rem}.pexp ul{padding-left:1.1rem;margin:.3rem 0}
details summary{cursor:pointer;font-size:.82rem;color:var(--muted);margin:.4rem 0}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.panes{grid-template-columns:1fr}}

</style>

<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => (x * 100).toFixed(1) + '%';
const fmt = iso => iso ? new Date(iso).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—';
const fmtD = d => d ? new Date(d + 'T00:00:00').toLocaleDateString([], {dateStyle:'medium'}) : '—';
const badge = (t, k) => `<span class="badge ${k}">${esc(t)}</span>`;
const qBadge = s => badge(s === 'pass' ? 'Quality OK' : s === 'warn' ? 'Quality warning' : 'Quality failed', s === 'pass' ? 'ok' : s === 'warn' ? 'warn' : 'bad');
const aBadge = s => ({completed: badge('Analysed','info'), pending: badge('Awaiting analysis','muted'), failed: badge('Analysis failed','bad'), skipped_quality: badge('Retake needed','bad')})[s] || '';
const rBadge = s => s === 'reviewed' ? badge('Reviewed','ok') : s === 'pending' ? badge('Awaiting review','warn') : '';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : '';
const EYE = {left:'Left eye', right:'Right eye'};
const TIER = {Low:'ok', Moderate:'warn', High:'bad', Incomplete:'muted'};
const tBadge = t => badge(t === 'Incomplete' ? 'Risk: incomplete' : `${t} risk`, TIER[t] || 'muted');
const EV = {rfmid_validated:['Validated (RFMiD)','ok'], conventional_reference:['Conventional reference','info'], heuristic:['Heuristic','warn']};
const evBadge = k => { const [t, c] = EV[k] || [k, 'muted']; return badge(t, c); };
const NOT_ASSESSED = {no_image:'no image uploaded', quality_failed:'image failed the quality check', analysis_not_completed:'no completed model analysis', fundus_not_found:'no fundus region found', invalid_model_output:'invalid model output'};
const scrMap = new Map();     // screening_id -> screening (for the clinical edit form)
const state = { api: localStorage.getItem('api') || 'http://localhost:8000', token: sessionStorage.getItem('token'), me: null, view: null };
const dash = { status:'pending_review', eye:'', abnormal:'', needs_review:'', q:'', sort:'priority', page:1 };
const pagers = {};            // ctx -> fn(page)
let qitems = new Map();       // image_id -> queue item (for patient context)
let ctxPatient = null;

function toast(msg, kind = 'ok') {
  const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
const fmtErr = d => Array.isArray(d) ? d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ') : (typeof d === 'string' ? d : '');
async function api(path, {method = 'GET', json, form, params, raw} = {}) {
  const url = new URL(state.api + '/api/v1' + path);
  for (const [k, v] of Object.entries(params || {})) if (v !== '' && v != null) url.searchParams.set(k, v);
  const headers = {}; let body;
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  if (json) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(json); } else if (form) body = form;
  let r;
  try { r = await fetch(url, {method, headers, body}); }
  catch { throw new Error(`Cannot reach the server at ${state.api}. Is it running, and is CORS configured (OPH_CORS_ORIGINS)?`); }
  if (r.status === 401 && state.token) { logout(); throw new Error('Session expired. Please sign in again.'); }
  if (!r.ok) { let d; try { d = (await r.json()).detail; } catch {} throw new Error(fmtErr(d) || r.statusText); }
  if (raw) return r;
  return r.status === 204 ? null : r.json();
}
const safe = fn => Promise.resolve().then(fn).catch(e => toast(e.message, 'err'));

const blobCache = new Map();
async function blobUrl(id, max) {
  const k = id + ':' + max; if (blobCache.has(k)) return blobCache.get(k);
  const r = await api(`/images/${id}/file`, {params: max ? {max_side: max} : {}, raw: true});
  const u = URL.createObjectURL(await r.blob()); blobCache.set(k, u); return u;
}
function hydrate(root = document) {
  root.querySelectorAll('img[data-img]:not([src])').forEach(async im => {
    try { im.src = await blobUrl(im.dataset.img, Number(im.dataset.max || 0)); } catch { im.alt = 'Image unavailable'; }
  });
}
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet"><button class="x" data-act="close" aria-label="Close">✕</button>${html}</div>`; m.hidden = false; document.body.style.overflow = 'hidden'; hydrate(m); }
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; document.body.style.overflow = ''; }
function logout() {
  sessionStorage.removeItem('token'); state.token = null; state.me = null; state.view = null;
  blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear(); closeModal(); render();
}

async function doLogin(email, password) {

/* ============ shared renderers ============ */
function dz(name, label) {
  return `<label class="dz"><input type="file" name="${name}" accept="image/png,image/jpeg" hidden>
    <div class="dzin">${eyeSvg(30)}<strong>${label}</strong><span class="small">Click or drop a JPEG/PNG</span></div><img class="prev" hidden alt=""></label>`;
}
function tile(i, role) {
  const fail = i.quality.status === 'fail';
  const issues = i.quality.issues.length ? `<ul class="issues">${i.quality.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : '';
  const hint = role === 'patient' && fail ? '<p class="small" style="color:var(--bad)">This image could not be used. Please retake and upload a clearer photo.</p>' : '';
  const ai = i.prediction ? `<p class="small">AI risk: <b>${pct(i.prediction.risk_probability)}</b></p>` : '';
  return `<div class="tile"><img class="thumb" data-img="${esc(i.id)}" data-max="500" alt="${esc(EYE[i.eye])}">
    <div class="row between" style="margin:.6rem 0 .3rem"><strong>${EYE[i.eye]}</strong><span class="small muted">${fmt(i.uploaded_at)}</span></div>
    <div class="chips">${qBadge(i.quality.status)}${aBadge(i.analysis_status)}${rBadge(i.review_status)}</div>${issues}${hint}${ai}
    <div class="row" style="margin-top:.7rem">${role === 'doctor' ? `<button class="btn sm" data-act="open" data-id="${esc(i.id)}">Open</button>` : ''}
    <label class="btn sm">Replace image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(i.screening_id)}" data-eye="${i.eye}"></label></div></div>`;
}
function addTile(sid, eye) {
  return `<div class="tile add"><strong>${EYE[eye]}</strong><span class="small">No image yet</span>
    <label class="btn sm">Add image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(sid)}" data-eye="${eye}"></label></div>`;
}
/* ---- clinical information form (symptoms/history for everyone; VA/IOP/CDR for doctors only) ---- */
const triSel = (name, v) => { const cur = v === true ? 'true' : v === false ? 'false' : '';
  return `<select name="${name}" data-cl="bool">${[['', 'Not recorded'], ['true', 'Yes'], ['false', 'No']].map(([x, l]) => `<option value="${x}" ${x === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`; };
const fld = (label, inner) => `<label class="f"><span>${label}</span>${inner}</label>`;
const numIn = (name, v, min, max, step) => `<input name="${name}" data-cl="num" type="number" min="${min}" max="${max}" step="${step}" value="${v ?? ''}" placeholder="not recorded">`;
function clinicalFields(role, c = {}) {
  const B = [['diabetes', 'Diabetes'], ['hypertension', 'Hypertension']], S = [['visual_field_loss', 'Visual field loss'], ['visual_distortion', 'Visual distortion'], ['eye_pain', 'Eye pain'], ['blurred_vision', 'Blurred vision'], ['floaters', 'Floaters']],
    F = [['family_history_glaucoma', 'Family history: glaucoma'], ['family_history_diabetic_retinopathy', 'Family history: diabetic retinopathy'], ['family_history_amd', 'Family history: AMD']];
  const prev = ['', 'none', 'cataract', 'glaucoma', 'amd', 'diabetic_retinopathy', 'other'];
  const meas = role === 'doctor' ? `<div class="clsec"><strong>Measurements (doctor-entered)</strong><div class="grid2">${fld('Visual acuity, right (decimal)', numIn('va_od', c.va_od, 0, 2, 0.01))}${fld('Visual acuity, left (decimal)', numIn('va_os', c.va_os, 0, 2, 0.01))}
    ${fld('IOP, right (mmHg)', numIn('iop_od', c.iop_od, 1, 80, 0.1))}${fld('IOP, left (mmHg)', numIn('iop_os', c.iop_os, 1, 80, 0.1))}${fld('Cup-to-disc ratio, right', numIn('cdr_od', c.cdr_od, 0, 1, 0.01))}${fld('Cup-to-disc ratio, left', numIn('cdr_os', c.cdr_os, 0, 1, 0.01))}</div></div>`
    : '<p class="small muted">Visual acuity, eye pressure and cup-to-disc ratio are measured and entered by your doctor.</p>';
  return `<p class="small muted">Optional. Leave anything you do not know as “Not recorded” — it is never guessed. Age is taken from the date of birth.</p>
    <div class="clsec"><strong>Systemic</strong><div class="grid2">${B.map(([k, l]) => fld(l, triSel(k, c[k]))).join('')}${fld('Diabetes duration (years)', numIn('diabetes_duration_years', c.diabetes_duration_years, 0, 80, 1))}</div></div>
    <div class="clsec"><strong>Symptoms</strong><div class="grid2">${S.map(([k, l]) => fld(l, triSel(k, c[k]))).join('')}</div></div>
    <div class="clsec"><strong>Family &amp; eye history</strong><div class="grid2">${F.map(([k, l]) => fld(l, triSel(k, c[k]))).join('')}
      ${fld('Previous eye condition', `<select name="previous_eye_condition" data-cl="enum">${prev.map(x => `<option value="${x}" ${x === (c.previous_eye_condition || '') ? 'selected' : ''}>${x ? cap(x) : 'Not recorded'}</option>`).join('')}</select>`)}
      ${fld('Previous eye surgery', triSel('previous_eye_surgery', c.previous_eye_surgery))}</div></div>${meas}`;
}
function clinicalPayload(f, full) {      // full=true (edit): send every field so values can be cleared; false (new screening): only filled fields
  const out = {};
  for (const el of f.querySelectorAll('[data-cl]')) {
    const v = el.value, k = el.name;
    out[k] = v === '' ? null : el.dataset.cl === 'bool' ? v === 'true' : el.dataset.cl === 'enum' ? v : Number(v);
  }
  if (out.diabetes === false) out.diabetes_duration_years = null;
  return full ? out : Object.fromEntries(Object.entries(out).filter(([, v]) => v !== null));
}

/* ---- doctor explainability: final tier, image band, clinical score/factors, decision logic, warnings ---- */
function riskCard(r) {
  const sc = x => x.risk_prob == null ? '' : `score <b>${x.risk_prob.toFixed(3)}</b> (screening ≥ ${x.thr_screening.toFixed(3)} · max-F1 ≥ ${x.thr_max_f1.toFixed(3)})`;
  const eyeBlock = e => {
    const x = r.eyes[e], iid = r.inputs?.eyes?.[e]?.image_id, assessed = x.state === 'assessed';
    const dom = Object.entries(x.clinical_domain_scores).map(([k, d]) => `${k} ${d.score}/${d.cap}${d.capped ? '*' : ''}`).join(' · ');
    const factors = x.drivers.filter(d => d.kind === 'clinical').map(d => `<tr><td>${esc(d.label)}</td><td>+${d.points}</td><td>${evBadge(d.evidence)}</td><td class="small muted">${d.scope === 'eye' ? 'this eye' : 'patient'}</td></tr>`).join('');
    const flags = x.drivers.filter(d => d.kind === 'red_flag').map(d => `<li>🚩 ${esc(d.label)} ${evBadge(d.evidence)}</li>`).join('');
    const ovr = x.drivers.filter(d => d.kind === 'override').map(d => `<li>${esc(d.label)} — ${esc(d.effect)}</li>`).join('');
    return `<div class="eyeblk"><div class="row between"><h5>${EYE[e]} ${assessed ? tBadge(x.tier) : badge('Not assessed', 'muted')}</h5>${iid ? `<button class="btn sm" data-act="open" data-id="${esc(iid)}">Image &amp; Grad-CAM</button>` : ''}</div>
      <p class="small" style="margin:.2rem 0"><b>Image:</b> ${assessed ? `band <b>${x.image_band}</b> — ${sc(x)} ${x.needs_review ? badge('model uncertain', 'warn') : ''}` : `<span class="muted">not assessed — ${esc(NOT_ASSESSED[x.not_assessed_reason] || x.not_assessed_reason)}</span>`}</p>
      <p class="small" style="margin:.2rem 0"><b>Clinical:</b> score <b>${x.clinical_score}/${x.clinical_max_score}</b> → band <b>${x.clinical_band}</b> <span class="muted">(${dom}; * = capped)</span></p>
      ${assessed ? `<p class="small" style="margin:.2rem 0"><b>Combination:</b> image ${x.image_band} + clinical ${x.clinical_band} → ${esc(x.matrix_tier)}${x.tier !== x.matrix_tier ? ` → <b>${esc(x.tier)}</b> after override` : ''}</p>` : ''}
      ${flags || ovr ? `<ul class="plain">${flags}${ovr}</ul>` : ''}
      ${factors ? `<details><summary class="small muted">Clinical factors counted (${x.drivers.filter(d => d.kind === 'clinical').length})</summary><table class="small"><thead><tr><th>Factor</th><th>Pts</th><th>Evidence</th><th></th></tr></thead><tbody>${factors}</tbody></table></details>` : ''}</div>`;
  };
  const gaps = r.data_gaps.length ? `<details><summary class="small muted">Data gaps (${r.data_gaps.length})</summary><ul class="plain">${r.data_gaps.map(g => `<li>${esc(g.message)}</li>`).join('')}</ul></details>` : '<p class="small muted">No data gaps.</p>';
  const warns = r.warnings.length ? `<div class="notice"><strong>Warnings</strong><ul class="plain">${r.warnings.map(w => `<li>${esc(w.message)}</li>`).join('')}</ul></div>` : '';
  const pdrv = r.patient_drivers.length ? `<ul class="plain">${r.patient_drivers.map(d => `<li>${esc(d.label)} — ${esc(d.effect)}</li>`).join('')}</ul>` : '';
  return `<div class="row" style="gap:1rem"><span class="tier ${TIER[r.tier] || 'muted'}">${r.tier === 'Incomplete' ? 'Incomplete' : r.tier + ' risk'}</span>
      <span class="small muted">${r.tier_driven_by ? `set by the ${EYE[r.tier_driven_by].toLowerCase()} · ` : ''}clinical data: ${esc(r.clinical_status.replace('_', ' '))}</span></div>
    ${pdrv}${warns}${['right', 'left'].map(eyeBlock).join('')}
    <details open><summary class="small muted">Decision logic</summary><ol class="path">${r.decision_path.map(l => `<li>${esc(l)}</li>`).join('')}</ol></details>${gaps}
    <details><summary class="small muted">What is validated vs heuristic</summary><ul class="plain">${Object.entries(r.evidence_legend).map(([k, v]) => `<li>${evBadge(k)} ${esc(v)}</li>`).join('')}</ul></details>
    <p class="small muted" style="margin-bottom:.3rem">${esc(r.rules_version)} · sha ${esc(r.rules_sha256.slice(0, 10))} · computed ${fmt(r.created_at)} (${esc(r.trigger.replace('_', ' '))})
      <button class="link" style="margin:0 0 0 .5rem" data-act="recompute" data-sid="${esc(r.screening_id)}">Re-assess</button></p>
    <div class="notice">${esc(r.rules_status)} ${esc(r.notice)}</div>`;
}
async function openRisk(sid) {
  openModal('<div class="skel"></div>');
  const r = await api(`/screenings/${sid}/risk`);
  $('#modal .sheet').innerHTML = `<button class="x" data-act="close" aria-label="Close">✕</button><h2>Risk assessment</h2>${riskCard(r)}`;

function riskStrip(s, role) {
  const btn = `<button class="btn sm" data-act="clinical" data-sid="${esc(s.id)}">${s.clinical ? 'Edit' : 'Add'} clinical info</button>`;
  if (role !== 'doctor' || !s.risk) return `<div class="row" style="margin-top:.8rem">${btn}</div>`;
  return `<div class="row between" style="margin-top:.8rem"><div class="chips">${tBadge(s.risk.tier)}${s.risk.data_gaps.length ? badge(`${s.risk.data_gaps.length} data gap${s.risk.data_gaps.length === 1 ? '' : 's'}`, 'muted') : ''}${s.risk.warnings.length ? badge('warnings', 'warn') : ''}</div>
    <div class="row"><button class="btn sm" data-act="risk" data-sid="${esc(s.id)}">Risk details</button>${btn}</div></div>`;
}
function screeningCard(s, role) {
  scrMap.set(s.id, s);
  const have = new Set(s.images.map(i => i.eye));
  const tiles = ['left', 'right'].map(e => have.has(e) ? tile(s.images.find(i => i.eye === e), role) : addTile(s.id, e)).join('');
  return `<div class="card"><div class="row between"><h3>Screening · ${fmt(s.created_at)}</h3><span class="muted small">ID ${esc(s.id.slice(0, 8))}</span></div><div class="grid2">${tiles}</div>${riskStrip(s, role)}</div>`;
}
function pager(ctx, page, size, total) {
  const pages = Math.max(1, Math.ceil(total / size));
  return `<div class="pager"><span>${total} item${total === 1 ? '' : 's'}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
    <span>Page ${page} / ${pages}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next ›</button></div>`;
}

    const row = d => `<div class="dis"><span>${d.flagged ? '🚩 ' : ''}<strong>${esc(d.name || d.code)}</strong>${d.name ? ` <span class="small muted">(${esc(d.code)})</span>` : ''}</span><div class="bar sm" style="width:100%"><i class="${d.flagged ? 'hi' : ''}" style="width:${pct(d.probability)}"></i></div><span class="right">${pct(d.probability)}</span></div>`;
    ai = `<div class="row" style="gap:1.5rem"><div><div class="big-n">${pct(p.risk_probability)}</div><div class="small muted">abnormal-risk probability</div></div>
      <div class="chips">${p.risk_abnormal_screening ? badge('Doctor review recommended', 'bad') : badge('Below screening threshold', 'ok')}${p.risk_abnormal_max_f1 ? badge('Above max-F1 threshold', 'warn') : ''}${p.needs_review ? badge('Model uncertain — review', 'warn') : ''}</div></div>
      <div class="bar big"><i class="${p.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(p.risk_probability)}"></i><b style="left:${pct(t.screening)}"><em>screening ${t.screening.toFixed(2)}</em></b><b style="left:${pct(t.max_f1)}"><em>max-F1 ${t.max_f1.toFixed(2)}</em></b></div>
      <p class="small muted">Model confidence ${p.risk_confidence.toFixed(2)} · ${esc(p.model_tag)} · ${fmt(p.created_at)}</p>${p.warnings.length ? `<div class="notice">Model warnings: ${esc(p.warnings.join(', '))}</div>` : ''}
      ${p.risk_abnormal_screening ? `<h4 style="margin-top:1rem">Highest-probability validated RFMiD abnormalities</h4>${p.top_abnormalities.map(row).join('')}` : `<div class="notice" style="margin-top:1rem"><strong>${esc(p.screening_message)}</strong></div>`}
      <details style="margin-top:.8rem"><summary class="small muted">All validated RFMiD classes (separate from Disease_Risk)</summary>${core.map(row).join('')}</details>
      <details style="margin-top:.8rem"><summary class="small muted">Other classes — probabilities only, not validated</summary>${other.map(row).join('')}</details><div class="notice">${esc(p.notice)}</div>`;
  }
  const m = q.metrics ? `<details><summary class="small muted">Quality metrics</summary><table class="small">${Object.entries(q.metrics).map(([k, v]) => `<tr><td>${esc(cap(k))}</td><td>${esc(v)}</td></tr>`).join('')}</table></details>` : '';
  const reviews = i.reviews.length ? i.reviews.map(r => `<div class="review"><strong>${esc(cap(r.decision))}</strong>${r.impression ? ' · impression: ' + esc(r.impression) : ''}<div class="small muted">${esc(r.doctor_name || 'Doctor')} · ${fmt(r.created_at)}</div>${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div>`).join('') : '<p class="muted small">No reviews yet.</p>';
  const form = p ? `<form data-form="review" data-pid="${esc(p.id)}" data-iid="${esc(i.id)}"><div class="grid2"><label class="f"><span>Decision</span><select name="decision"><option value="agree">Agree with AI</option><option value="disagree">Disagree with AI</option><option value="needs_retake">Needs retake</option><option value="inconclusive">Inconclusive</option></select></label>
    <label class="f"><span>Your impression</span><select name="impression"><option value="">—</option><option value="normal">Normal</option><option value="abnormal">Abnormal</option><option value="ungradable">Ungradable</option></select></label></div>
    <label class="f"><span>Comment (max 2000 chars)</span><textarea name="comment" rows="3" maxlength="2000"></textarea></label><button class="btn pri" type="submit">Save review</button></form>` : '';
  const gcCore = p ? p.diseases.filter(d => d.validated) : [], gcCodes = [...new Set([...gcCore.filter(d => d.flagged), ...gcCore.slice(0, 3)].map(d => d.code))];
  const gcCard = p && p.crop_ok ? `<div class="card"><h4>Attention map (Grad-CAM)</h4><p class="small muted" style="margin-top:0">Where the image pushed the selected score up. Computed on demand.</p><div class="row"><select id="gc-target" style="flex:1;min-width:200px"><option value="risk">Abnormal-risk score</option>${gcCodes.map(c => { const d = gcCore.find(x => x.code === c); return `<option value="${esc(c)}">${esc(d.name || c)} (${esc(c)})</option>`; }).join('')}</select><button class="btn sm" data-act="gradcam" data-id="${esc(i.id)}">Show map</button></div><div id="gc-out"></div></div>` : '';
  const rerun = i.quality.status !== 'fail' && i.analysis_status !== 'completed' ? `<button class="btn sm" data-act="analyze" data-id="${esc(i.id)}">Run analysis</button>` : '';
  $('#modal .sheet').innerHTML = `<button class="x" data-act="close" aria-label="Close">✕</button><h2>${EYE[i.eye]} · ${fmt(i.uploaded_at)}</h2>${patientLine}
    <div class="split"><div><div class="card"><img class="thumb" data-img="${esc(i.id)}" data-max="1100" alt="Fundus"><p class="small muted" style="margin:.6rem 0 0">${esc(i.original_filename || '')} · ${i.width}×${i.height}px</p></div>
    <div class="card"><h4>Image quality</h4><div class="chips">${qBadge(q.status)}${aBadge(i.analysis_status)}${rerun}</div>${q.issues.length ? `<ul class="issues">${q.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : ''}${m}</div></div>
    <div>${risk ? `<div class="card"><h4>Risk assessment (screening-level)</h4>${riskCard(risk)}</div>` : ''}<div class="card"><h4>AI result</h4>${ai}</div>${gcCard}<div class="card"><h4>Doctor review</h4>${reviews}${form}</div></div></div>`;
  hydrate($('#modal'));
}

/* ============ doctor: patients ============ */
async function viewPatients({q = '', page = 1} = {}) {

  $('#main').innerHTML = `<div class="card"><div class="row between" style="margin-bottom:1rem"><input type="search" id="psearch" style="max-width:360px" placeholder="Search name or MRN…" value="${esc(q)}">
    <button class="btn pri" data-act="enrol">+ Enrol patient</button></div>${r.items.length ? `<div class="tw"><table><thead><tr><th>Name</th><th>MRN</th><th>Date of birth</th><th>Sex</th><th>Account</th></tr></thead><tbody>
    ${r.items.map(p => `<tr data-act="patient" data-id="${esc(p.id)}"><td><strong>${esc(p.full_name)}</strong></td><td>${esc(p.medical_record_number || '—')}</td><td>${fmtD(p.date_of_birth)}</td><td>${esc(cap(p.sex))}</td><td>${p.has_account ? badge('Has login', 'info') : badge('Walk-in', 'muted')}</td></tr>`).join('')}</tbody></table></div>${pager('patients', r.page, r.size, r.total)}` : '<div class="empty">No patients found.</div>'}</div>`;

async function viewPatient({id}) {

  $('#main').innerHTML = `<button class="link" data-act="tab" data-v="patients">← Patients</button><div class="card"><div class="row between"><div><h2>${esc(p.full_name)}</h2>
    <p class="muted">MRN ${esc(p.medical_record_number || '—')} · DOB ${fmtD(p.date_of_birth)} · ${esc(cap(p.sex))}</p></div><button class="btn pri" data-act="newscreen" data-id="${esc(p.id)}">+ New screening</button></div></div>
    <h3>History</h3><div id="hist"></div>`;

/* ============ view table ============ */
const VIEWS = {
  dashboard: viewDashboard, patients: () => viewPatients(), patient: viewPatient, upload: viewUpload,
  history: () => viewHistory({pid: state.me.patient_id}),
};

/* ============ events ============ */
const ACT = {
  logout, close: closeModal,
  authtab: el => renderAuth(el.dataset.mode),
  tab: el => go({name: el.dataset.v, pid: state.me.patient_id}),
  back: () => go(state.view.back || {name: 'dashboard'}),
  page: el => pagers[el.dataset.ctx](Number(el.dataset.p)),
  card: el => { Object.assign(dash, {status: el.dataset.st, abnormal: '', needs_review: '', page: 1}, JSON.parse(el.dataset.x)); renderShell(); },
  open: el => { const id = el.dataset.id; return openDetail(id, qitems.get(id)?.patient || ctxPatient); },
  patient: el => go({name: 'patient', id: el.dataset.id}),
  newscreen: el => go({name: 'upload', pid: el.dataset.id, back: {name: 'patient', id: el.dataset.id}}),
  analyze: async el => { await api(`/images/${el.dataset.id}/analyze`, {method: 'POST'}); toast('Analysis complete'); await openDetail(el.dataset.id, ctxPatient); refreshBehind(); },
  gradcam: async el => {
    const out = $('#gc-out'), target = $('#gc-target').value; el.disabled = true; out.innerHTML = '<div class="skel" style="margin-top:.75rem"></div>';
    try {
      const g = await api(`/images/${el.dataset.id}/gradcam`, {params: {target}});
      out.innerHTML = g.empty ? '<div class="notice">No positive contribution was found for this output, so there is no map to show.</div>'
        : `<img class="thumb" style="aspect-ratio:1/1;margin-top:.75rem" alt="Grad-CAM: ${esc(g.target_name)}" src="data:image/jpeg;base64,${g.overlay_jpeg_base64}"><p class="small muted" style="margin:.5rem 0 0">${esc(g.target_name)} · drawn on the model's cropped input view · ${g.grid_size}×${g.grid_size} grid</p>`;
      out.insertAdjacentHTML('beforeend', `<div class="notice">${esc(g.notice)}</div>`);
    } catch (e) { out.innerHTML = ''; throw e; } finally { el.disabled = false; }
  },
  risk: el => openRisk(el.dataset.sid),
  recompute: async el => { await api(`/screenings/${el.dataset.sid}/risk/recompute`, {method: 'POST'}); toast('Risk re-assessed'); await openRisk(el.dataset.sid); },
  clinical: el => {
    const s = scrMap.get(el.dataset.sid);
    openModal(`<h2>Clinical information</h2><form data-form="clinical" data-sid="${esc(el.dataset.sid)}">${clinicalFields(state.me.role, s?.clinical || {})}
      <div class="row end"><button class="btn pri" type="submit">Save</button></div></form>`);
  },
  enrol: () => openModal(`<h2>Enrol patient</h2><p class="muted">For patients without an account (e.g. walk-ins).</p><form data-form="enrol"><label class="f"><span>Full name</span><input name="full_name" required></label>
    <div class="grid2"><label class="f"><span>Date of birth</span><input name="date_of_birth" type="date" required></label><label class="f"><span>Sex</span><select name="sex"><option value="unknown">Unknown</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></label></div>
    <label class="f"><span>Medical record number (optional)</span><input name="medical_record_number"></label><button class="btn pri" type="submit">Create patient</button></form>`),
};
function refreshBehind() { if (state.view?.name === 'dashboard') { loadSummary(); loadQueue(); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('modal')) return;
  if (el.tagName === 'TR' && e.target.closest('a,button,label')) return;
  e.preventDefault(); safe(() => ACT[el.dataset.act]?.(el, e));
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const FORMS = {
  login: async f => { const d = new FormData(f); await doLogin(d.get('email').trim(), d.get('password')); },
  register: async f => {
    const d = Object.fromEntries(new FormData(f)); d.email = d.email.trim();
    await api('/auth/register', {method: 'POST', json: d}); toast('Account created'); await doLogin(d.email, d.password);
  },
  enrol: async f => {
    const d = Object.fromEntries(new FormData(f)); if (!d.medical_record_number.trim()) delete d.medical_record_number;
    const p = await api('/patients', {method: 'POST', json: d}); closeModal(); toast('Patient enrolled'); go({name: 'patient', id: p.id});
  },
  review: async f => {
    const d = Object.fromEntries(new FormData(f)); const body = {decision: d.decision}; if (d.impression) body.impression = d.impression; if (d.comment.trim()) body.comment = d.comment.trim();
    await api(`/predictions/${f.dataset.pid}/reviews`, {method: 'POST', json: body}); toast('Review saved'); await openDetail(f.dataset.iid, ctxPatient); refreshBehind();
  },
  clinical: async f => {
    const r = await api(`/screenings/${f.dataset.sid}/clinical`, {method: 'POST', json: clinicalPayload(f, true)});
    closeModal(); toast(r.changed_fields.length ? 'Clinical information saved' : 'No changes'); renderShell();
  },
  upload: async f => {
    const fd = new FormData(), btn = f.querySelector('button[type=submit]'); let n = 0;
    for (const name of ['left_image', 'right_image']) {
      const file = f.querySelector(`[name=${name}]`).files[0]; if (!file) continue;
      if (file.size > 25 * 1024 * 1024) throw new Error(`${name === 'left_image' ? 'Left' : 'Right'} image is larger than 25 MB`);
      fd.append(name, file); n++;
    }
    if (!n) throw new Error('Choose a left and/or right image first');
    const cl = clinicalPayload(f, false); if (Object.keys(cl).length) fd.append('clinical', JSON.stringify(cl));
    btn.disabled = true; btn.textContent = 'Uploading & analysing…';
    try {
      const s = await api(`/patients/${f.dataset.pid}/screenings`, {method: 'POST', form: fd});
      $('#upres').innerHTML = '<h3>Result</h3>' + screeningCard(s, state.me.role); hydrate($('#upres')); toast('Screening saved');
      f.reset(); f.querySelectorAll('.prev').forEach(p => p.hidden = true); f.querySelectorAll('.dzin').forEach(p => p.hidden = false);
    } finally { btn.disabled = false; btn.textContent = 'Upload & analyse'; }
  },
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); safe(() => FORMS[f.dataset.form](f)); });

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'apiurl') { state.api = t.value.trim().replace(/\/+$/, ''); localStorage.setItem('api', state.api); toast('Server URL saved'); }
  else if (t.dataset.filter) { dash[t.dataset.filter] = t.value; dash.page = 1; safe(loadQueue); }
  else if (t.matches('.dz input[type=file]')) {
    const file = t.files[0], dzEl = t.closest('.dz'), img = dzEl.querySelector('.prev');
    if (file) { img.src = URL.createObjectURL(file); img.hidden = false; dzEl.querySelector('.dzin').hidden = true; }
  } else if (t.matches('[data-retake]') && t.files[0]) {
    const fd = new FormData(); fd.append('eye', t.dataset.eye); fd.append('image', t.files[0]);
    safe(async () => { toast('Uploading…'); await api(`/screenings/${t.dataset.sid}/images`, {method: 'POST', form: fd}); toast('Image uploaded'); renderShell(); });
  }
});
let ft; document.addEventListener('input', e => { if (e.target.dataset.filter === 'q') { clearTimeout(ft); ft = setTimeout(() => { dash.q = e.target.value.trim(); dash.page = 1; safe(loadQueue); }, 350); } });
document.addEventListener('dragover', e => { const z = e.target.closest('.dz'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => e.target.closest?.('.dz')?.classList.remove('over'));
document.addEventListener('drop', e => {
  const z = e.target.closest('.dz'); if (!z) return; e.preventDefault(); z.classList.remove('over');
  const inp = z.querySelector('input'); inp.files = e.dataTransfer.files; inp.dispatchEvent(new Event('change', {bubbles: true}));
});

/* ============ boot ============ */
(async function boot() {
  if (state.token) {
    try { state.me = await api('/auth/me'); state.view = state.me.role === 'doctor' ? {name: 'dashboard'} : {name: 'upload', pid: state.me.patient_id}; }
    catch { state.token = null; sessionStorage.removeItem('token'); }
  }
  render();
})();
</script>
<script>
/* ===== UX layer: grouped worklist, case workspace (viewer + explanation), patient-facing explanation =====
   Loaded after the base script; overrides loadSummary / loadQueue / openDetail / screeningCard and VIEWS.dashboard. */
const UX = (() => {
  const EYES = ['right', 'left'];                       // clinical convention: OD (right) shown on the left of the screen
  const LAB = {right: 'OD · Right eye', left: 'OS · Left eye'};
  const BAND_IMG = {I0: ['Below screening threshold', 'ok'], I1: ['Borderline', 'warn'], I2: ['Above operating threshold', 'bad']};
  const BAND_CLIN = {C0: ['Few factors', 'ok'], C1: ['Some factors', 'warn'], C2: ['Many factors / red flag', 'bad']};
  const EVC = {rfmid_validated: ['V', 'Validated on RFMiD'], conventional_reference: ['R', 'Conventional reference value'], heuristic: ['H', 'Heuristic design choice']};
  const BOOLS = ['diabetes', 'hypertension', 'blurred_vision', 'floaters', 'visual_field_loss', 'eye_pain', 'visual_distortion',
    'family_history_glaucoma', 'family_history_diabetic_retinopathy', 'family_history_amd', 'previous_eye_surgery'];
  const age = d => Math.floor((Date.now() - new Date(d + 'T00:00:00')) / 31557600000);
  const tierTxt = t => t === 'Incomplete' ? 'Incomplete' : t + ' risk';
  const origCard = screeningCard;
  let S = null;                                         // current case state

  /* ---------- worklist ---------- */
  const loadSummary = async () => {
    const s = await api('/dashboard/summary');
    const k = (n, l, st, x, on) => `<button class="kpi ${on ? 'on' : ''}" data-act="card" data-st="${st}" data-x='${JSON.stringify(x)}'><b>${n}</b><span>${l}</span></button>`;
    $('#sumbox').innerHTML = `<div class="kpis">${k(s.pending_review, 'Pending review', 'pending_review', {}, dash.status === 'pending_review' && !dash.abnormal && !dash.needs_review)}
      ${k(s.pending_flagged_abnormal, 'AI-flagged', 'pending_review', {abnormal: 'true'}, dash.abnormal === 'true')}
      ${k(s.pending_model_uncertain, 'Model uncertain', 'pending_review', {needs_review: 'true'}, dash.needs_review === 'true')}
      ${k(s.reviewed_today_utc, 'Reviewed today', 'reviewed', {}, false)}</div>`;
    const sg = [['pending_review', 'Pending', s.pending_review], ['reviewed', 'Reviewed', s.reviewed_total], ['quality_failed', 'Retake', s.quality_failed], ['analysis_incomplete', 'Incomplete', s.analysis_incomplete]];
    $('#segs').innerHTML = sg.map(([v, l, n]) => `<button data-act="seg" data-st="${v}" class="${dash.status === v ? 'on' : ''}">${l}<span>${n}</span></button>`).join('');
  };
  const done = i => i.review_status === 'reviewed' ? '<span class="sub" title="Reviewed">✓</span>' : '';
  const cell = i => !i ? '<span class="cell muted">—</span>'
    : i.quality_status === 'fail' ? '<span class="cell muted"><i class="dot"></i>Retake</span>'
    : i.risk_probability == null ? '<span class="cell muted"><i class="dot"></i>Pending</span>'
    : `<span class="cell" title="${esc(i.quality_status === 'warn' ? 'Quality warning: ' + i.quality_issue_codes.map(cap).join(', ') : 'Quality OK')}"><i class="dot ${i.risk_abnormal_screening ? 'r' : i.needs_review ? 'a' : 'g'}"></i>${Math.round(i.risk_probability * 100)}%${done(i)}</span>`;
  const prioOf = c => { const e = Object.values(c.e);
    if (e.some(i => i.risk_abnormal_screening)) return badge('Flagged', 'bad');
    if (e.some(i => i.needs_review)) return badge('Uncertain', 'warn');
    if (e.some(i => i.quality_status === 'fail')) return badge('Retake', 'muted');
    if (e.every(i => i.risk_probability == null)) return badge('Awaiting analysis', 'muted');
    return badge('Routine', 'ok'); };
  const loadQueue = async () => {
    const q = await api('/dashboard/queue', {params: {...dash, size: 50}});
    qitems = new Map(q.items.map(i => [i.image_id, i]));
    const g = new Map();                                // one row per screening (both eyes), not per image
    q.items.forEach(i => { const c = g.get(i.screening_id) || {first: i.image_id, p: i.patient, at: i.uploaded_at, e: {}};
      c.e[i.eye] = i; if (i.uploaded_at > c.at) c.at = i.uploaded_at; g.set(i.screening_id, c); });
    if (dash.status !== 'all' && g.size) {              // the other eye may already be reviewed / not pending: fetch it so the row is complete
      try { const all = await api('/dashboard/queue', {params: {status: 'all', size: 100, q: dash.q}});
        all.items.forEach(i => { const c = g.get(i.screening_id); if (c && !c.e[i.eye]) c.e[i.eye] = i; }); } catch {}
    }
    const rows = [...g.values()].map(c => `<tr data-act="open" data-id="${esc(c.first)}"><td><b>${esc(c.p.full_name)}</b>
      <div class="sub">${esc(c.p.medical_record_number || 'No MRN')} · ${age(c.p.date_of_birth)}y · ${esc(cap(c.p.sex))}</div></td>
      <td>${cell(c.e.right)}</td><td>${cell(c.e.left)}</td><td>${prioOf(c)}</td><td class="sub">${fmt(c.at)}</td><td class="chev">›</td></tr>`).join('');
    $('#qbox').innerHTML = rows ? `<div class="tw"><table class="wl"><thead><tr><th>Patient</th><th>OD</th><th>OS</th><th>Priority</th><th>Uploaded</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="legend"><span><i class="dot r"></i>Flagged</span><span><i class="dot a"></i>Uncertain</span><span><i class="dot g"></i>Below threshold</span><span>Value = model abnormal score</span></div>${pager('queue', q.page, q.size, q.total)}`
      : '<div class="empty">No cases match these filters.</div>';
  };
  const dashboard = async () => {
    const prio = dash.abnormal === 'true' ? 'flag' : dash.needs_review === 'true' ? 'unc' : '';
    $('#main').innerHTML = `<div id="sumbox"></div><div class="card flush"><div class="toolbar"><div class="seg" id="segs"></div>
      <input type="search" data-filter="q" placeholder="Search name or MRN" value="${esc(dash.q)}">
      <select data-ux="prio"><option value="">All priorities</option><option value="flag" ${prio === 'flag' ? 'selected' : ''}>AI-flagged</option><option value="unc" ${prio === 'unc' ? 'selected' : ''}>Model uncertain</option></select>
      <select data-filter="sort"><option value="priority">Priority</option><option value="newest">Newest</option><option value="risk">Highest score</option></select></div>
      <div id="qbox"><div class="skel"></div></div></div>`;
    $('[data-filter=sort]').value = dash.sort;
    pagers.queue = p => { dash.page = p; loadQueue(); };
    await Promise.all([loadSummary(), loadQueue()]);
  };

  /* ---------- case workspace: viewer ---------- */
  const pane = e => { const i = S.imgs[e];
    if (!i) return `<div class="pane empty"><span class="tag">${LAB[e]}</span>No image</div>`;
    const q = i.quality, k = q.status === 'pass' ? 'g' : q.status === 'warn' ? 'a' : 'r';
    const t = q.status === 'pass' ? 'Quality OK' : q.status === 'warn' ? `Quality: ${q.issues.length} note${q.issues.length === 1 ? '' : 's'}` : 'Retake needed';
    return `<div class="pane" id="pane-${e}" data-act="zoom"><span class="tag">${LAB[e]}</span><span class="qtag" title="${esc(q.issues.map(x => x.message).join('; ') || 'No quality issues')}"><i class="dot ${k}"></i>${t}</span>
      <img data-img="${esc(i.id)}" data-max="1100" alt="Fundus, ${LAB[e]}"></div>`; };
  const paint = async () => {
    document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
    await Promise.all(EYES.map(async e => {
      const i = S.imgs[e], pn = $('#pane-' + e); if (!i || !pn) return;
      const im = pn.querySelector('img'); pn.querySelector('.note')?.remove();
      if (S.mode === 'orig') { im.src = await blobUrl(i.id, 1100); return; }
      if (!i.prediction || !i.prediction.crop_ok) { pn.insertAdjacentHTML('beforeend', '<div class="note">No attention map for this image</div>'); return; }
      const k = i.id + ':' + S.target;
      try { S.gc[k] = S.gc[k] || await api(`/images/${i.id}/gradcam`, {params: {target: S.target}}); } catch (err) { toast(err.message, 'err'); return; }
      const g = S.gc[k];
      if (g.empty) { pn.insertAdjacentHTML('beforeend', '<div class="note">No positive contribution for this output</div>'); return; }
      im.src = 'data:image/jpeg;base64,' + g.overlay_jpeg_base64;
      $('#gcnote').textContent = `${g.target_name}: warm colours = regions that raised this score. Drawn on the model's cropped view. ${g.notice}`;
    }));
    if (S.mode === 'orig') $('#gcnote').textContent = 'Click an image to zoom. OD (right) is on the left, OS (left) on the right.';
  };

  /* ---------- case workspace: side panel ---------- */
  const sentence = r => {
    if (!r) return 'Risk assessment is not available for this screening.';
    if (r.tier === 'Incomplete') return 'No eye has a usable image yet, so no risk level can be given.';
    const n = r.data_gaps.length, unc = EYES.filter(e => r.eyes[e]?.overrides_applied?.includes('model_needs_review_floor'));
    const flagged = EYES.some(e => r.eyes[e]?.image_band === 'I2');
    let s = r.tier_driven_by ? `Set by the ${r.tier_driven_by} eye (the worse eye). ` : '';
    if (unc.length && !flagged && r.tier === 'Moderate') s += `Raised to Moderate only because the model was uncertain about the ${unc.join(' and ')} eye; no abnormal finding was flagged. `;
    return s + (n ? `${n} clinical field${n === 1 ? '' : 's'} not recorded.` : ''); };
  const overrideOf = r => { if (!r || !r.tier_driven_by) return null; const x = r.eyes[r.tier_driven_by];
    if (!x || x.tier === x.matrix_tier) return null;
    const d = (x.drivers || []).find(d => d.kind === 'override');
    return {eye: r.tier_driven_by, from: x.matrix_tier, to: x.tier, text: d ? d.label : 'Override applied', effect: d ? d.effect : ''}; };
  const whyBox = r => { const o = overrideOf(r); if (!o) return '';
    return `<div class="notice" style="margin:0 0 .8rem"><b>Why ${esc(o.to)} and not ${esc(o.from)}?</b><br>The image score and clinical data for the ${o.eye} eye both point to ${esc(o.from)}. It was raised to ${esc(o.to)} only because: ${esc(o.text)}.
      This is a caution flag, not an abnormal finding: the rules never report Low when the model is unsure. <button class="link" style="margin:0" data-act="ctab" data-t="why">See the steps</button></div>`; };
  const eyeSum = e => {
    const i = S.imgs[e], x = S.risk?.eyes?.[e], p = i?.prediction, head = `<b>${LAB[e]}</b>`;
    if (!i) return `<div class="eyeb"><div class="eh">${head}</div><p class="sub" style="margin:0">No image uploaded.</p></div>`;
    const v = x && x.state === 'assessed' ? {prob: x.risk_prob, ts: x.thr_screening, tf: x.thr_max_f1, unc: x.needs_review, tier: x.tier}
      : p ? {prob: p.risk_probability, ts: p.risk_thresholds.screening, tf: p.risk_thresholds.max_f1, unc: p.needs_review, tier: null} : null;
    if (!v) return `<div class="eyeb"><div class="eh">${head}${badge('Not assessed', 'muted')}</div><p class="sub" style="margin:0">${esc(x ? NOT_ASSESSED[x.not_assessed_reason] || '' : 'No analysis yet')}</p>
      ${i.quality.status !== 'fail' && i.analysis_status !== 'completed' ? `<button class="btn sm" style="margin-top:.5rem" data-act="analyze" data-id="${esc(i.id)}">Run analysis</button>` : ''}</div>`;
    const top = p && p.risk_abnormal_screening ? p.top_abnormalities.slice(0, 2).map(d => `<li>${esc(d.name || d.code)} <b>${pct(d.probability)}</b></li>`).join('') : '';
    return `<div class="eyeb"><div class="eh">${head}${v.unc ? badge('Uncertain', 'warn') : ''}${v.tier ? tBadge(v.tier) : ''}</div>
      <div class="big">${pct(v.prob)}<small>abnormal score</small></div>
      <div class="gauge"><i class="${v.prob >= v.ts ? 'hi' : ''}" style="width:${pct(v.prob)}"></i><b style="left:${pct(v.ts)}"></b><b style="left:${pct(v.tf)}"></b></div>
      <div class="sub">Thresholds: screening ${v.ts.toFixed(2)} · operating ${v.tf.toFixed(2)}</div>
      ${top ? `<div class="sub" style="margin-top:.5rem">Most likely findings (validated classes)</div><ul class="plain">${top}</ul>` : ''}</div>`; };
  const sumTab = () => { const r = S.risk;
    const tier = r ? `<div class="eyeb"><div class="eh"><b>Overall</b><span class="tier ${TIER[r.tier] || 'muted'}" style="font-size:1rem">${tierTxt(r.tier)}</span></div>
      <p class="sub" style="margin:0">${esc(sentence(r))} <button class="link" style="margin:0" data-act="ctab" data-t="why">Why?</button></p></div>` : '';
    const warn = r && r.warnings.length ? `<div class="notice"><ul class="plain">${r.warnings.map(w => `<li>${esc(w.message)}</li>`).join('')}</ul></div>` : '';
    return whyBox(r) + tier + warn + EYES.map(eyeSum).join('') + (r ? `<p class="sub">${esc(r.notice)}</p>` : ''); };
  const whyTab = () => { const r = S.risk; if (!r) return '<p class="muted">No risk assessment available.</p>';
    const eyeWhy = e => { const x = r.eyes[e]; if (!x) return '';
      if (x.state !== 'assessed') return `<div class="eyeb"><div class="eh"><b>${LAB[e]}</b>${badge('Not assessed', 'muted')}</div><p class="sub" style="margin:0">${esc(NOT_ASSESSED[x.not_assessed_reason] || '')}${x.clinical_band === 'C2' ? ' Clinical findings alone place this patient at least Moderate.' : ''}</p></div>`;
      const [ib, ik] = BAND_IMG[x.image_band] || [x.image_band, 'muted'], [cb, ck] = BAND_CLIN[x.clinical_band] || [x.clinical_band, 'muted'];
      const dom = Object.values(x.clinical_domain_scores).map(d => `<div class="dm"><span>${esc(d.label)}</span><div class="gauge"><i style="width:${d.cap ? d.score / d.cap * 100 : 0}%"></i></div><span>${d.score}/${d.cap}${d.capped ? '*' : ''}</span></div>`).join('');
      const fac = x.drivers.filter(d => ['clinical', 'red_flag', 'override'].includes(d.kind)).map(d => { const [l, t] = EVC[d.evidence] || ['?', d.evidence];
        return `<li><span class="ev ${l}" title="${esc(t)}">${l}</span><span>${d.kind === 'red_flag' ? '<b>Red flag</b> · ' : ''}${esc(d.label)}</span><b>${d.points != null ? '+' + d.points : ''}</b></li>`; }).join('');
      return `<div class="eyeb"><div class="eh"><b>${LAB[e]}</b></div>
        <div class="flow"><div><small>Image</small>${badge(ib, ik)}</div><i>+</i><div><small>Clinical ${x.clinical_score}/${x.clinical_max_score}</small>${badge(cb, ck)}</div><i>→</i><div><small>Result</small>${tBadge(x.tier)}</div></div>
        ${x.overrides_applied?.includes('model_needs_review_floor') ? `<div class="notice" style="margin:.2rem 0 .6rem"><b>Why not Low?</b> Image and clinical evidence alone give <b>${esc(x.matrix_tier)}</b>. The model reported low confidence on this image, and the rules never allow an uncertain image to be called Low, so the result is raised to <b>${esc(x.tier)}</b>. This is not a finding of disease.</div>` : x.matrix_tier && x.tier !== x.matrix_tier ? `<p class="sub">Combined ${esc(x.matrix_tier)} → ${esc(x.tier)} after override.</p>` : ''}${dom}
        ${fac ? `<ul class="fac">${fac}</ul>` : '<p class="sub">No clinical factors counted.</p>'}</div>`; };
    return whyBox(r) + `<p class="sub" style="margin-top:0">Each eye combines image evidence with clinical evidence; the patient takes the worse eye.</p>${EYES.map(eyeWhy).join('')}
      <details><summary>Decision path</summary><ol class="path">${r.decision_path.map(l => `<li>${esc(l)}</li>`).join('')}</ol></details>
      <details><summary>Data gaps (${r.data_gaps.length})</summary><ul class="plain">${r.data_gaps.map(g => `<li>${esc(g.message)}</li>`).join('') || '<li>None</li>'}</ul></details>
      <p class="sub"><span class="ev V">V</span> validated · <span class="ev R">R</span> conventional reference · <span class="ev H">H</span> heuristic<br>${esc(r.rules_version)} · ${esc(r.rules_sha256.slice(0, 8))} · ${fmt(r.created_at)}
      <button class="link" style="margin:0 0 0 .4rem" data-act="recompute" data-sid="${esc(S.sid)}">Re-assess</button></p>`; };
  const clinTab = () => { const c = S.clin, btn = `<button class="btn sm" data-act="clinedit">${c ? 'Edit' : 'Add'} clinical data</button>`;
    if (!c) return `<p class="muted">No clinical data recorded for this visit.</p>${btn}`;
    const m = (k, bad) => EYES.map(e => { const v = c[k + (e === 'right' ? '_od' : '_os')]; return `<td class="${v != null && bad(v) ? 'abn' : ''}">${v ?? '—'}</td>`; }).join('');
    const pos = BOOLS.filter(k => c[k] === true).map(k => badge(cap(k), 'muted')).join(' ');
    return `<table class="kv"><thead><tr><th></th><th>OD</th><th>OS</th></tr></thead><tbody><tr><td>Visual acuity</td>${m('va', v => v < 0.5)}</tr>
      <tr><td>IOP (mmHg)</td>${m('iop', v => v > 21)}</tr><tr><td>Cup/disc ratio</td>${m('cdr', v => v >= 0.6)}</tr></tbody></table>
      <p class="sub">Highlighted values cross conventional reference cut-offs (VA &lt; 0.5, IOP &gt; 21, CDR ≥ 0.6).</p>
      <div class="sub" style="margin:.8rem 0 .3rem">Reported</div><div class="chips">${pos || '<span class="sub">Nothing reported</span>'}</div>
      ${c.previous_eye_condition && c.previous_eye_condition !== 'none' ? `<p class="sub">Previous condition: ${esc(cap(c.previous_eye_condition))}</p>` : ''}<p style="margin-top:1rem">${btn}</p>`; };
  const reviewTab = () => EYES.filter(e => S.imgs[e]).map(e => { const i = S.imgs[e], p = i.prediction;
    const past = i.reviews.map(r => `<div class="rev"><b>${esc(cap(r.decision))}</b>${r.impression ? ' · ' + esc(r.impression) : ''}<div class="sub">${esc(r.doctor_name || 'Doctor')} · ${fmt(r.created_at)}</div>${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div>`).join('');
    const form = p ? `<form data-form="review" data-pid="${esc(p.id)}" data-iid="${esc(i.id)}"><div class="grid2"><label class="f"><span>Decision</span><select name="decision"><option value="agree">Agree with AI</option><option value="disagree">Disagree with AI</option><option value="needs_retake">Needs retake</option><option value="inconclusive">Inconclusive</option></select></label>
      <label class="f"><span>Impression</span><select name="impression"><option value="">—</option><option value="normal">Normal</option><option value="abnormal">Abnormal</option><option value="ungradable">Ungradable</option></select></label></div>
      <label class="f"><span>Comment</span><textarea name="comment" rows="2" maxlength="2000"></textarea></label><button class="btn pri sm" type="submit">Save review</button></form>` : '<p class="sub">No AI result to review.</p>';
    return `<div class="eyeb"><div class="eh"><b>${LAB[e]}</b>${i.review_status ? rBadge(i.review_status) : ''}</div>${past}${form}</div>`; }).join('');

  const caseView = async v => {
    const i0 = await api('/images/' + v.id), sid = i0.screening_id;
    const [scr, risk, clin] = await Promise.all([api('/screenings/' + sid), api(`/screenings/${sid}/risk`).catch(() => null), api(`/screenings/${sid}/clinical`).catch(() => null)]);
    const imgs = {}; scr.images.forEach(i => { imgs[i.eye] = i; }); imgs[i0.eye] = imgs[i0.eye] || i0;
    S = {sid, imgs, risk, clin, patient: v.patient || ctxPatient, mode: 'orig', target: 'risk', gc: {}};
    const codes = new Map();
    EYES.forEach(e => (imgs[e]?.prediction?.diseases || []).filter(d => d.validated && d.flagged).forEach(d => codes.set(d.code, d.name || d.code)));
    const p = S.patient;
    $('#main').innerHTML = `<button class="link" data-act="back">← Back</button>
      <div class="row between" style="margin-bottom:1rem"><div><h2 style="margin:0">${p ? esc(p.full_name) : 'Screening'}</h2>
      <div class="sub">${p ? `${esc(p.medical_record_number || 'No MRN')} · ${age(p.date_of_birth)}y · ${esc(cap(p.sex))} · ` : ''}Uploaded ${fmt(i0.uploaded_at)}</div></div>
      ${risk ? `<div class="right"><span class="tier ${TIER[risk.tier] || 'muted'}">${tierTxt(risk.tier)}</span>${overrideOf(risk) ? '<div class="sub" style="margin-top:.3rem">Raised by model uncertainty</div>' : ''}</div>` : ''}</div>
      <div class="case"><section class="viewer"><div class="vbar"><div class="seg"><button data-act="vmode" data-m="orig" class="on">Original</button><button data-act="vmode" data-m="cam">Attention map</button></div>
      <select data-ux="gctarget"><option value="risk">Overall abnormal score</option>${[...codes].map(([c, n]) => `<option value="${esc(c)}">${esc(n)}</option>`).join('')}</select></div>
      <div class="panes">${EYES.map(pane).join('')}</div><p class="sub" id="gcnote"></p></section>
      <aside class="side"><div class="seg tabs"><button data-act="ctab" data-t="sum" class="on">Summary</button><button data-act="ctab" data-t="why">Explanation</button><button data-act="ctab" data-t="cli">Clinical</button><button data-act="ctab" data-t="rev">Review</button></div>
      <div class="tp on" data-tp="sum">${sumTab()}</div><div class="tp" data-tp="why">${whyTab()}</div><div class="tp" data-tp="cli">${clinTab()}</div><div class="tp" data-tp="rev">${reviewTab()}</div></aside></div>`;
    $('#gcnote').textContent = 'Click an image to zoom. OD (right) is on the left, OS (left) on the right.';
  };

  /* ---------- patient-facing explanation (plain language; only what the API already allows the patient to see) ---------- */
  const PT = {Low: 'Nothing in your images or answers stood out. Routine eye checks are still important.',
    Moderate: 'Something may deserve a closer look. Your doctor will go through it with you.',
    High: 'Your doctor will look at your images as a priority.', Incomplete: 'We need a usable image before we can say anything.'};
  const PB = {I0: 'looked within the expected range', I1: 'was borderline', I2: 'showed patterns that were flagged for review'};
  const patientExplain = s => { const r = s.risk, im = s.images; if (!im.length) return '';
    const steps = [['Images received', true], ['Quality checked', im.every(i => i.quality.status !== 'fail')], ['Doctor review', im.some(i => i.review_status === 'reviewed')]];
    const tips = im.filter(i => i.quality.issues.length).map(i => `<li><b>${EYE[i.eye]}:</b> ${i.quality.issues.map(x => esc(x.message)).join(' ')}</li>`).join('');
    let body = '<p class="sub">Your doctor will review your images and explain the results to you.</p>';
    if (r) {
      const lines = EYES.map(e => { const x = r.eyes[e]; return x ? `<li><b>${EYE[e]}:</b> ${x.state === 'assessed' ? 'the image ' + (PB[x.image_band] || '') : 'could not be assessed (' + esc(NOT_ASSESSED[x.not_assessed_reason] || 'no usable image') + ')'}</li>` : ''; }).join('');
      const used = [...new Set(EYES.flatMap(e => r.eyes[e]?.drivers || []).filter(d => d.kind === 'clinical' || d.kind === 'red_flag').map(d => d.label))];
      const gaps = r.data_gaps.slice(0, 3).map(g => `<li>${esc(g.message)}</li>`).join('');
      body = `<p><b>${esc(PT[r.tier] || '')}</b></p><div class="sub">What this is based on</div><ul>${lines}</ul>
        ${used.length ? `<div class="sub">Things taken into account</div><div class="chips" style="margin:.3rem 0">${used.map(u => badge(u, 'muted')).join('')}</div>` : ''}
        ${gaps ? `<div class="sub" style="margin-top:.6rem">Adding this would make the result more complete</div><ul>${gaps}</ul>` : ''}`;
    }
    return `<div class="pexp"><h4>Your result, explained</h4><ol class="steps">${steps.map(([l, ok]) => `<li class="${ok ? 'done' : ''}">${l}</li>`).join('')}</ol>${body}
      ${tips ? `<div class="sub">To get a clearer photo next time</div><ul>${tips}</ul>` : ''}<p class="sub">This is a screening aid, not a diagnosis. Only a doctor can diagnose an eye condition.</p></div>`; };

  /* ---------- wiring ---------- */
  Object.assign(ACT, {
    seg: el => { Object.assign(dash, {status: el.dataset.st, abnormal: '', needs_review: '', page: 1}); renderShell(); },
    zoom: el => el.classList.toggle('z'),
    vmode: async el => { S.mode = el.dataset.m; await paint(); },
    ctab: el => { document.querySelectorAll('.tabs [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === el.dataset.t));
      document.querySelectorAll('[data-tp]').forEach(p => p.classList.toggle('on', p.dataset.tp === el.dataset.t)); },
    clinedit: () => { scrMap.set(S.sid, {clinical: S.clin || {}}); ACT.clinical({dataset: {sid: S.sid}}); },
  });
  document.addEventListener('change', e => { const t = e.target;
    if (t.dataset.ux === 'prio') { dash.abnormal = t.value === 'flag' ? 'true' : ''; dash.needs_review = t.value === 'unc' ? 'true' : ''; dash.page = 1; safe(() => Promise.all([loadSummary(), loadQueue()])); }
    else if (t.dataset.ux === 'gctarget' && S) { S.target = t.value; if (S.mode === 'cam') safe(paint); } });
  document.addEventListener('mousemove', e => { const pn = e.target.closest?.('.pane.z'); if (!pn) return;
    const b = pn.getBoundingClientRect(); pn.querySelector('img').style.transformOrigin = `${(e.clientX - b.left) / b.width * 100}% ${(e.clientY - b.top) / b.height * 100}%`; });

  return {
    loadSummary, loadQueue, dashboard, caseView,
    open: (id, patient) => go({name: 'case', id, patient: patient || S?.patient || ctxPatient, back: state.view?.name === 'case' ? state.view.back : state.view}),
    card: (s, role) => { const h = origCard(s, role); return role === 'patient' ? h.replace(/<\/div>\s*$/, patientExplain(s) + '</div>') : h; },
  };
})();
loadSummary = UX.loadSummary; loadQueue = UX.loadQueue; openDetail = UX.open; screeningCard = UX.card;
VIEWS.dashboard = UX.dashboard; VIEWS.case = UX.caseView;
</script>
</body>
</html>
