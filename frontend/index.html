<!-- <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OphthaScreen · Fundus Screening</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--pri:#4f46e5;--pri2:#0ea5e9;
--ok:#047857;--okbg:#d1fae5;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--mutedbg:#eef1f7;
--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#121a2f;--ink:#e6eaf5;--muted:#93a0bd;--line:#1f2a47;
--ok:#6ee7b7;--okbg:#064e3b;--warn:#fcd34d;--warnbg:#4a3206;--bad:#fca5a5;--badbg:#4c1313;--info:#93c5fd;--infobg:#172554;--mutedbg:#1a2340;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25}h2{font-size:1.35rem}h3{font-size:1.05rem}h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:.25rem 0 .75rem}.muted{color:var(--muted)}.small{font-size:.85rem}.right{text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:.55rem .95rem;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.btn.pri:hover{filter:brightness(1.08);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.btn.sm{padding:.3rem .65rem;font-size:.85rem}
.link{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;margin-bottom:.75rem}
input,select,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
label.f{display:block;margin-bottom:.85rem;font-size:.85rem;font-weight:600;color:var(--muted)}label.f>*:not(span){margin-top:.3rem;font-weight:400;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1rem}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
/* header / nav */
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.5rem;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.1rem}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff}
.who{display:flex;align-items:center;gap:.75rem}.chip{background:var(--mutedbg);padding:.25rem .7rem;border-radius:99px;font-size:.85rem}
.wrap{max-width:1200px;margin:0 auto;padding:1.25rem}
nav.tabs{display:flex;gap:.4rem;margin-bottom:1.25rem;flex-wrap:wrap}nav.tabs button{border:0;background:transparent;padding:.55rem 1rem;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
footer{max-width:1200px;margin:0 auto;padding:1rem 1.25rem 2rem;color:var(--muted);font-size:.8rem}
/* badges */
.badge{display:inline-block;padding:.12rem .6rem;border-radius:99px;font-size:.75rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.info{background:var(--infobg);color:var(--info)}.badge.muted{background:var(--mutedbg);color:var(--muted)}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(145deg,#312e81,#0369a1);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:2.2rem}.hero li{margin:.5rem 0;opacity:.92}.hero ul{padding-left:1.1rem}
.authcard{padding:3rem;display:flex;flex-direction:column;justify-content:center;max-width:480px;width:100%;margin:0 auto}
.tabs2{display:flex;gap:.4rem;background:var(--mutedbg);padding:.3rem;border-radius:12px;margin-bottom:1.25rem}.tabs2 button{flex:1;border:0;background:none;padding:.55rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
details.srv{margin-top:1rem;color:var(--muted);font-size:.85rem}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:2rem}.authcard{padding:2rem 1.25rem}}
/* summary cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left}
.stat:hover{transform:translateY(-2px);border-color:var(--pri)}.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{color:var(--muted);font-size:.8rem}
.stat.on{outline:2px solid var(--pri)}
/* table */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.55rem .75rem;border-bottom:1px solid var(--line)}
td{padding:.7rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:var(--mutedbg)}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.filters>*{width:auto;min-width:130px}.filters input[type=search]{flex:1;min-width:200px}
.pager{display:flex;gap:.75rem;align-items:center;justify-content:flex-end;margin-top:.9rem;color:var(--muted);font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
/* bars */
.bar{position:relative;height:10px;border-radius:99px;background:var(--mutedbg);overflow:visible}.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri2)}
.bar>i.hi{background:linear-gradient(90deg,#f59e0b,#ef4444)}.bar.sm{width:90px;height:8px}.bar.big{height:14px;margin:1.4rem 0 1.6rem}
.bar>b{position:absolute;top:-5px;width:2px;height:24px;background:var(--ink)}.bar>b em{position:absolute;top:26px;left:-30px;width:62px;text-align:center;font-style:normal;font-size:.68rem;color:var(--muted);font-weight:600}
.rk{display:flex;align-items:center;gap:.5rem;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
/* dropzone */
.dz{display:block;border:2px dashed var(--line);border-radius:var(--r);min-height:200px;cursor:pointer;position:relative;overflow:hidden;transition:.15s;background:var(--card)}
.dz:hover,.dz.over{border-color:var(--pri);background:var(--mutedbg)}.dzin{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;color:var(--muted)}
.dz .prev{width:100%;height:200px;object-fit:contain;background:#000;display:block}
.thumb{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0b0b0f;border-radius:10px;display:block}
.tile{border:1px solid var(--line);border-radius:12px;padding:.8rem;background:var(--card)}.tile.add{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5rem;color:var(--muted);border-style:dashed;min-height:180px}
.issues{margin:.4rem 0 0;padding-left:1.1rem;font-size:.85rem;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:20;overflow:auto;padding:2rem 1rem;backdrop-filter:blur(3px)}
.sheet{max-width:1100px;margin:0 auto;background:var(--bg);border-radius:18px;padding:1.5rem;position:relative}
.x{position:absolute;right:1rem;top:1rem;border:0;background:var(--card);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;box-shadow:var(--shadow)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.25rem}@media(max-width:900px){.split{grid-template-columns:1fr}}
.notice{background:var(--warnbg);color:var(--warn);padding:.6rem .8rem;border-radius:10px;font-size:.82rem;margin:.75rem 0}
.dis{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 60px;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
.review{border-left:3px solid var(--pri);padding:.4rem .8rem;margin:.5rem 0;background:var(--card);border-radius:0 8px 8px 0}
.big-n{font-size:2.4rem;font-weight:800;line-height:1}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--mutedbg),var(--card),var(--mutedbg));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:1rem}@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;right:1rem;bottom:1rem;z-index:50;display:flex;flex-direction:column;gap:.5rem}.t{padding:.7rem 1rem;border-radius:10px;color:#fff;box-shadow:var(--shadow);max-width:360px;font-size:.9rem}.t.ok{background:#047857}.t.err{background:#b91c1c}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => (x * 100).toFixed(1) + '%';
const fmt = iso => iso ? new Date(iso).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—';
const fmtD = d => d ? new Date(d + 'T00:00:00').toLocaleDateString([], {dateStyle:'medium'}) : '—';
const badge = (t, k) => `<span class="badge ${k}">${esc(t)}</span>`;
const qBadge = s => badge(s === 'pass' ? 'Quality OK' : s === 'warn' ? 'Quality warning' : 'Quality failed', s === 'pass' ? 'ok' : s === 'warn' ? 'warn' : 'bad');
const aBadge = s => ({completed: badge('Analysed','info'), pending: badge('Awaiting analysis','muted'), failed: badge('Analysis failed','bad'), skipped_quality: badge('Retake needed','bad')})[s] || '';
const rBadge = s => s === 'reviewed' ? badge('Reviewed','ok') : s === 'pending' ? badge('Awaiting review','warn') : '';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : '';
const EYE = {left:'Left eye', right:'Right eye'};
const state = { api: localStorage.getItem('api') || 'http://localhost:8000', token: sessionStorage.getItem('token'), me: null, view: null };
const dash = { status:'pending_review', eye:'', abnormal:'', needs_review:'', q:'', sort:'priority', page:1 };
const pagers = {};            // ctx -> fn(page)
let qitems = new Map();       // image_id -> queue item (for patient context)
let ctxPatient = null;

function toast(msg, kind = 'ok') {
  const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
const fmtErr = d => Array.isArray(d) ? d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ') : (typeof d === 'string' ? d : '');
async function api(path, {method = 'GET', json, form, params, raw} = {}) {
  const url = new URL(state.api + '/api/v1' + path);
  for (const [k, v] of Object.entries(params || {})) if (v !== '' && v != null) url.searchParams.set(k, v);
  const headers = {}; let body;
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  if (json) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(json); } else if (form) body = form;
  let r;
  try { r = await fetch(url, {method, headers, body}); }
  catch { throw new Error(`Cannot reach the server at ${state.api}. Is it running, and is CORS configured (OPH_CORS_ORIGINS)?`); }
  if (r.status === 401 && state.token) { logout(); throw new Error('Session expired. Please sign in again.'); }
  if (!r.ok) { let d; try { d = (await r.json()).detail; } catch {} throw new Error(fmtErr(d) || r.statusText); }
  if (raw) return r;
  return r.status === 204 ? null : r.json();
}
const safe = fn => Promise.resolve().then(fn).catch(e => toast(e.message, 'err'));

const blobCache = new Map();
async function blobUrl(id, max) {
  const k = id + ':' + max; if (blobCache.has(k)) return blobCache.get(k);
  const r = await api(`/images/${id}/file`, {params: max ? {max_side: max} : {}, raw: true});
  const u = URL.createObjectURL(await r.blob()); blobCache.set(k, u); return u;
}
function hydrate(root = document) {
  root.querySelectorAll('img[data-img]:not([src])').forEach(async im => {
    try { im.src = await blobUrl(im.dataset.img, Number(im.dataset.max || 0)); } catch { im.alt = 'Image unavailable'; }
  });
}
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet"><button class="x" data-act="close" aria-label="Close">✕</button>${html}</div>`; m.hidden = false; document.body.style.overflow = 'hidden'; hydrate(m); }
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; document.body.style.overflow = ''; }
function logout() {
  sessionStorage.removeItem('token'); state.token = null; state.me = null; state.view = null;
  blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear(); closeModal(); render();
}

/* ============ auth ============ */
function renderAuth(mode = 'login') {
  const login = `<form data-form="login"><label class="f"><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
    <label class="f"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%" type="submit">Sign in</button>
    <p class="muted small" style="margin-top:1rem">Doctor accounts are created by your administrator.</p></form>`;
  const reg = `<form data-form="register"><label class="f"><span>Full name</span><input name="full_name" required></label>
    <label class="f"><span>Email</span><input name="email" type="email" required></label>
    <div class="grid2"><label class="f"><span>Date of birth</span><input name="date_of_birth" type="date" required max="${new Date().toISOString().slice(0,10)}"></label>
    <label class="f"><span>Sex</span><select name="sex"><option value="unknown">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></label></div>
    <label class="f"><span>Password (min. 10 characters)</span><input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="btn pri" style="width:100%" type="submit">Create patient account</button></form>`;
  $('#app').innerHTML = `<div class="auth"><section class="hero"><div class="brand" style="margin-bottom:2rem"><span class="logo">${eyeSvg(20)}</span>OphthaScreen</div>
    <h1>AI-assisted fundus screening</h1><p style="opacity:.9">Upload retinal images, get an automatic quality check, and let clinicians review the AI result.</p>
    <ul><li>Left &amp; right eye upload</li><li>Automatic image-quality check</li><li>ConvNeXt-Tiny screening model</li><li>Doctor review dashboard</li></ul>
    <p class="small" style="opacity:.75;margin-top:2rem">Research prototype. Not a medical device; not for diagnosis.</p></section>
    <section class="authcard"><div class="tabs2"><button data-act="authtab" data-mode="login" class="${mode==='login'?'on':''}">Sign in</button>
    <button data-act="authtab" data-mode="register" class="${mode==='register'?'on':''}">Patient sign-up</button></div>${mode === 'login' ? login : reg}
    <details class="srv"><summary>Server settings</summary><label class="f" style="margin-top:.6rem"><span>API URL</span><input id="apiurl" value="${esc(state.api)}"></label></details></section></div>`;
}
const eyeSvg = n => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;

async function doLogin(email, password) {
  const t = await api('/auth/login', {method: 'POST', form: new URLSearchParams({username: email, password})});
  state.token = t.access_token; sessionStorage.setItem('token', t.access_token);
  state.me = await api('/auth/me');
  state.view = state.me.role === 'doctor' ? {name: 'dashboard'} : {name: 'upload', pid: state.me.patient_id};
  render();
}

/* ============ shell / routing ============ */
function render() { if (!state.me) return renderAuth(); renderShell(); }
function renderShell() {
  const doc = state.me.role === 'doctor';
  const nav = doc ? [['dashboard','Dashboard'], ['patients','Patients']] : [['upload','Upload images'], ['history','My history']];
  const active = state.view.name === 'patient' ? 'patients' : state.view.name;
  $('#app').innerHTML = `<header class="top"><div class="brand"><span class="logo">${eyeSvg(18)}</span>OphthaScreen</div>
    <div class="who"><span class="chip">${esc(state.me.full_name)} · ${esc(state.me.role)}</span><button class="btn sm" data-act="logout">Sign out</button></div></header>
    <div class="wrap"><nav class="tabs">${nav.map(([k, l]) => `<button data-act="tab" data-v="${k}" class="${active === k ? 'on' : ''}">${l}</button>`).join('')}</nav><main id="main"></main></div>
    <footer>Research prototype — not a medical device and not clinically validated. AI output is decision support only and never replaces review by a qualified clinician.</footer>`;
  $('#main').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const v = VIEWS[state.view.name];
  safe(() => v(state.view)).then(() => hydrate($('#main')));
}
function go(view) { state.view = view; renderShell(); }

/* ============ shared renderers ============ */
function dz(name, label) {
  return `<label class="dz"><input type="file" name="${name}" accept="image/png,image/jpeg" hidden>
    <div class="dzin">${eyeSvg(30)}<strong>${label}</strong><span class="small">Click or drop a JPEG/PNG</span></div><img class="prev" hidden alt=""></label>`;
}
function tile(i, role) {
  const fail = i.quality.status === 'fail';
  const issues = i.quality.issues.length ? `<ul class="issues">${i.quality.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : '';
  const hint = role === 'patient' && fail ? '<p class="small" style="color:var(--bad)">This image could not be used. Please retake and upload a clearer photo.</p>' : '';
  const ai = i.prediction ? `<p class="small">AI risk: <b>${pct(i.prediction.risk_probability)}</b></p>` : '';
  return `<div class="tile"><img class="thumb" data-img="${esc(i.id)}" data-max="500" alt="${esc(EYE[i.eye])}">
    <div class="row between" style="margin:.6rem 0 .3rem"><strong>${EYE[i.eye]}</strong><span class="small muted">${fmt(i.uploaded_at)}</span></div>
    <div class="chips">${qBadge(i.quality.status)}${aBadge(i.analysis_status)}${rBadge(i.review_status)}</div>${issues}${hint}${ai}
    <div class="row" style="margin-top:.7rem">${role === 'doctor' ? `<button class="btn sm" data-act="open" data-id="${esc(i.id)}">Open</button>` : ''}
    <label class="btn sm">Replace image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(i.screening_id)}" data-eye="${i.eye}"></label></div></div>`;
}
function addTile(sid, eye) {
  return `<div class="tile add"><strong>${EYE[eye]}</strong><span class="small">No image yet</span>
    <label class="btn sm">Add image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(sid)}" data-eye="${eye}"></label></div>`;
}
function screeningCard(s, role) {
  const have = new Set(s.images.map(i => i.eye));
  const tiles = ['left', 'right'].map(e => have.has(e) ? tile(s.images.find(i => i.eye === e), role) : addTile(s.id, e)).join('');
  return `<div class="card"><div class="row between"><h3>Screening · ${fmt(s.created_at)}</h3><span class="muted small">ID ${esc(s.id.slice(0, 8))}</span></div><div class="grid2">${tiles}</div></div>`;
}
function pager(ctx, page, size, total) {
  const pages = Math.max(1, Math.ceil(total / size));
  return `<div class="pager"><span>${total} item${total === 1 ? '' : 's'}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
    <span>Page ${page} / ${pages}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next ›</button></div>`;
}

/* ============ patient views ============ */
async function viewUpload({pid, back}) {
  $('#main').innerHTML = `${back ? '<button class="link" data-act="back">← Back</button>' : ''}
    <div class="card"><h2>New screening</h2><p class="muted">Upload a left and/or right fundus photo (JPEG or PNG, up to 25 MB each). Images are quality-checked automatically.</p>
    <form data-form="upload" data-pid="${esc(pid)}"><div class="grid2">${dz('left_image', 'Left eye')}${dz('right_image', 'Right eye')}</div>
    <div class="row end" style="margin-top:1rem"><button class="btn pri" type="submit">Upload &amp; analyse</button></div></form></div><div id="upres"></div>`;
}
async function viewHistory({pid, page = 1, host}) {
  const box = host || $('#main');
  const h = await api(`/patients/${pid}/screenings`, {params: {page, size: 5}});
  const role = state.me.role;
  box.innerHTML = (host ? '' : '<h2>My history</h2>') + (h.items.length ? h.items.map(s => screeningCard(s, role)).join('') + pager('hist', h.page, h.size, h.total)
    : '<div class="card empty">No screenings yet.</div>');
  pagers.hist = p => safe(() => viewHistory({pid, page: p, host}).then(() => hydrate(box)));
}

/* ============ doctor: dashboard ============ */
async function viewDashboard() {
  $('#main').innerHTML = `<div id="sumbox"></div><div class="card"><div class="filters">

async function loadSummary() {

  $('#sumbox').innerHTML = `<div class="stats">${c(s.pending_review, 'Pending review', 'pending_review', {}, dash.status === 'pending_review' && !dash.abnormal && !dash.needs_review)}

    ${c(s.pending_model_uncertain, 'Model uncertain', 'pending_review', {needs_review: 'true'}, dash.needs_review === 'true')}
    ${c(s.reviewed_today_utc, 'Reviewed today', 'reviewed')}${c(s.quality_failed, 'Quality failed', 'quality_failed')}${c(s.analysis_incomplete, 'Analysis incomplete', 'analysis_incomplete')}</div>`;

async function loadQueue() {
  const q = await api('/dashboard/queue', {params: {...dash, size: 15}});

  const risk = i => i.risk_probability == null ? '<span class="muted">—</span>' :
    `<div class="rk"><div class="bar sm"><i class="${i.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(i.risk_probability)}"></i></div><span>${pct(i.risk_probability)}</span></div>`;
  const rows = q.items.map(i => `<tr data-act="open" data-id="${esc(i.image_id)}"><td><strong>${esc(i.patient.full_name)}</strong><div class="small muted">${esc(i.patient.medical_record_number || '—')}</div></td>
    <td>${EYE[i.eye]}</td><td>${risk(i)}</td><td><div class="chips">${i.flagged_diseases.map(d => badge(d, 'bad')).join('')}${i.needs_review ? badge('Uncertain', 'warn') : ''}</div></td>
    <td>${qBadge(i.quality_status)}${i.quality_issue_codes.length ? `<div class="small muted">${esc(i.quality_issue_codes.map(cap).join(', '))}</div>` : ''}</td>
    <td>${i.review_status ? rBadge(i.review_status) : aBadge(i.analysis_status)}${i.last_review ? `<div class="small muted">${esc(cap(i.last_review.decision))}</div>` : ''}</td><td class="small">${fmt(i.uploaded_at)}</td></tr>`).join('');
  $('#qbox').innerHTML = q.items.length ? `<div class="tw"><table><thead><tr><th>Patient</th><th>Eye</th><th>AI risk</th><th>Flags</th><th>Image quality</th><th>Status</th><th>Uploaded</th></tr></thead><tbody>${rows}</tbody></table></div>${pager('queue', q.page, q.size, q.total)}`
    : '<div class="empty">Nothing here. 🎉</div>';

/* ============ doctor: image detail & review ============ */
async function openDetail(id, patient) {
  openModal('<div class="skel"></div><div class="skel"></div>');
  const i = await api('/images/' + id);
  const p = i.prediction, q = i.quality;
  const patientLine = patient ? `<p class="muted">${esc(patient.full_name)} · ${esc(patient.medical_record_number || 'no MRN')} · DOB ${fmtD(patient.date_of_birth)} · ${esc(cap(patient.sex))}</p>` : '';
  let ai = '<p class="muted">No AI result for this image.</p>';
  if (p) {
    const t = p.risk_thresholds, core = p.diseases.filter(d => d.validated), other = p.diseases.filter(d => !d.validated).slice(0, 10);
    const row = d => `<div class="dis"><span>${d.flagged ? '🚩 ' : ''}<strong>${esc(d.code)}</strong>${d.name ? ' — ' + esc(d.name) : ''}</span><div class="bar sm" style="width:100%"><i class="${d.flagged ? 'hi' : ''}" style="width:${pct(d.probability)}"></i></div><span class="right">${pct(d.probability)}</span></div>`;
    ai = `<div class="row" style="gap:1.5rem"><div><div class="big-n">${pct(p.risk_probability)}</div><div class="small muted">abnormal-risk probability</div></div>
      <div class="chips">${p.risk_abnormal_screening ? badge('Above screening threshold', 'bad') : badge('Below screening threshold', 'ok')}${p.risk_abnormal_max_f1 ? badge('Above max-F1 threshold', 'warn') : ''}${p.needs_review ? badge('Model uncertain — review', 'warn') : ''}</div></div>
      <div class="bar big"><i class="${p.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(p.risk_probability)}"></i><b style="left:${pct(t.screening)}"><em>screening ${t.screening.toFixed(2)}</em></b><b style="left:${pct(t.max_f1)}"><em>max-F1 ${t.max_f1.toFixed(2)}</em></b></div>
      <p class="small muted">Model confidence ${p.risk_confidence.toFixed(2)} · ${esc(p.model_tag)} · ${fmt(p.created_at)}</p>${p.warnings.length ? `<div class="notice">Model warnings: ${esc(p.warnings.join(', '))}</div>` : ''}
      <h4 style="margin-top:1rem">Validated disease classes</h4>${core.map(row).join('')}
      <details style="margin-top:.8rem"><summary class="small muted">Other classes — probabilities only, not validated</summary>${other.map(row).join('')}</details><div class="notice">${esc(p.notice)}</div>`;
  }
  const m = q.metrics ? `<details><summary class="small muted">Quality metrics</summary><table class="small">${Object.entries(q.metrics).map(([k, v]) => `<tr><td>${esc(cap(k))}</td><td>${esc(v)}</td></tr>`).join('')}</table></details>` : '';
  const reviews = i.reviews.length ? i.reviews.map(r => `<div class="review"><strong>${esc(cap(r.decision))}</strong>${r.impression ? ' · impression: ' + esc(r.impression) : ''}<div class="small muted">${esc(r.doctor_name || 'Doctor')} · ${fmt(r.created_at)}</div>${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div>`).join('') : '<p class="muted small">No reviews yet.</p>';
  const form = p ? `<form data-form="review" data-pid="${esc(p.id)}" data-iid="${esc(i.id)}"><div class="grid2"><label class="f"><span>Decision</span><select name="decision"><option value="agree">Agree with AI</option><option value="disagree">Disagree with AI</option><option value="needs_retake">Needs retake</option><option value="inconclusive">Inconclusive</option></select></label>
    <label class="f"><span>Your impression</span><select name="impression"><option value="">—</option><option value="normal">Normal</option><option value="abnormal">Abnormal</option><option value="ungradable">Ungradable</option></select></label></div>
    <label class="f"><span>Comment (max 2000 chars)</span><textarea name="comment" rows="3" maxlength="2000"></textarea></label><button class="btn pri" type="submit">Save review</button></form>` : '';
  const rerun = i.quality.status !== 'fail' && i.analysis_status !== 'completed' ? `<button class="btn sm" data-act="analyze" data-id="${esc(i.id)}">Run analysis</button>` : '';
  $('#modal .sheet').innerHTML = `<button class="x" data-act="close" aria-label="Close">✕</button><h2>${EYE[i.eye]} · ${fmt(i.uploaded_at)}</h2>${patientLine}
    <div class="split"><div><div class="card"><img class="thumb" data-img="${esc(i.id)}" data-max="1100" alt="Fundus"><p class="small muted" style="margin:.6rem 0 0">${esc(i.original_filename || '')} · ${i.width}×${i.height}px</p></div>
    <div class="card"><h4>Image quality</h4><div class="chips">${qBadge(q.status)}${aBadge(i.analysis_status)}${rerun}</div>${q.issues.length ? `<ul class="issues">${q.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : ''}${m}</div></div>
    <div><div class="card"><h4>AI result</h4>${ai}</div><div class="card"><h4>Doctor review</h4>${reviews}${form}</div></div></div>`;
  hydrate($('#modal'));
}

/* ============ doctor: patients ============ */
async function viewPatients({q = '', page = 1} = {}) {
  const r = await api('/patients', {params: {q, page, size: 15}});
  $('#main').innerHTML = `<div class="card"><div class="row between" style="margin-bottom:1rem"><input type="search" id="psearch" style="max-width:360px" placeholder="Search name or MRN…" value="${esc(q)}">

  pagers.patients = p => safe(() => viewPatients({q, page: p}));

async function viewPatient({id}) {

/* ============ view table ============ */
const VIEWS = {
  dashboard: viewDashboard, patients: () => viewPatients(), patient: viewPatient, upload: viewUpload,

  logout, close: closeModal,

document.addEventListener('click', e => {

});

const FORMS = {
  login: async f => { const d = new FormData(f); await doLogin(d.get('email').trim(), d.get('password')); },
  register: async f => {
    const d = Object.fromEntries(new FormData(f)); d.email = d.email.trim();
    await api('/auth/register', {method: 'POST', json: d}); toast('Account created'); await doLogin(d.email, d.password);
  },
  enrol: async f => {
    const d = Object.fromEntries(new FormData(f)); if (!d.medical_record_number.trim()) delete d.medical_record_number;
    const p = await api('/patients', {method: 'POST', json: d}); closeModal(); toast('Patient enrolled'); go({name: 'patient', id: p.id});
  },
  review: async f => {
    const d = Object.fromEntries(new FormData(f)); const body = {decision: d.decision}; if (d.impression) body.impression = d.impression; if (d.comment.trim()) body.comment = d.comment.trim();
    await api(`/predictions/${f.dataset.pid}/reviews`, {method: 'POST', json: body}); toast('Review saved'); await openDetail(f.dataset.iid, ctxPatient); refreshBehind();
  },
  upload: async f => {
    const fd = new FormData(), btn = f.querySelector('button[type=submit]'); let n = 0;
    for (const name of ['left_image', 'right_image']) {

      fd.append(name, file); n++;

    try {
      const s = await api(`/patients/${f.dataset.pid}/screenings`, {method: 'POST', form: fd});
      $('#upres').innerHTML = '<h3>Result</h3>' + screeningCard(s, state.me.role); hydrate($('#upres')); toast('Screening saved');
      f.reset(); f.querySelectorAll('.prev').forEach(p => p.hidden = true); f.querySelectorAll('.dzin').forEach(p => p.hidden = false);
    } finally { btn.disabled = false; btn.textContent = 'Upload & analyse'; }
  },

document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); safe(() => FORMS[f.dataset.form](f)); });

document.addEventListener('change', e => {

  else if (t.dataset.filter) { dash[t.dataset.filter] = t.value; dash.page = 1; safe(loadQueue); }
  else if (t.matches('.dz input[type=file]')) {

    if (file) { img.src = URL.createObjectURL(file); img.hidden = false; dzEl.querySelector('.dzin').hidden = true; }
  } else if (t.matches('[data-retake]') && t.files[0]) {
    const fd = new FormData(); fd.append('eye', t.dataset.eye); fd.append('image', t.files[0]);
    safe(async () => { toast('Uploading…'); await api(`/screenings/${t.dataset.sid}/images`, {method: 'POST', form: fd}); toast('Image uploaded'); renderShell(); });
  }
});
let ft; document.addEventListener('input', e => { if (e.target.dataset.filter === 'q') { clearTimeout(ft); ft = setTimeout(() => { dash.q = e.target.value.trim(); dash.page = 1; safe(loadQueue); }, 350); } });
document.addEventListener('dragover', e => { const z = e.target.closest('.dz'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => e.target.closest?.('.dz')?.classList.remove('over'));

  const inp = z.querySelector('input'); inp.files = e.dataTransfer.files; inp.dispatchEvent(new Event('change', {bubbles: true}));

/* ============ boot ============ */

    catch { state.token = null; sessionStorage.removeItem('token'); }
  }
  render();
})();

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;cursor:pointer;box-shadow:var(--shadow);transition:.15s;text-align:left}
.stat:hover{transform:translateY(-2px);border-color:var(--pri)}.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{color:var(--muted);font-size:.8rem}
.stat.on{outline:2px solid var(--pri)}
/* table */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.55rem .75rem;border-bottom:1px solid var(--line)}
td{padding:.7rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:var(--mutedbg)}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.filters>*{width:auto;min-width:130px}.filters input[type=search]{flex:1;min-width:200px}
.pager{display:flex;gap:.75rem;align-items:center;justify-content:flex-end;margin-top:.9rem;color:var(--muted);font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
/* bars */
.bar{position:relative;height:10px;border-radius:99px;background:var(--mutedbg);overflow:visible}.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri2)}
.bar>i.hi{background:linear-gradient(90deg,#f59e0b,#ef4444)}.bar.sm{width:90px;height:8px}.bar.big{height:14px;margin:1.4rem 0 1.6rem}
.bar>b{position:absolute;top:-5px;width:2px;height:24px;background:var(--ink)}.bar>b em{position:absolute;top:26px;left:-30px;width:62px;text-align:center;font-style:normal;font-size:.68rem;color:var(--muted);font-weight:600}
.rk{display:flex;align-items:center;gap:.5rem;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
/* dropzone */
.dz{display:block;border:2px dashed var(--line);border-radius:var(--r);min-height:200px;cursor:pointer;position:relative;overflow:hidden;transition:.15s;background:var(--card)}
.dz:hover,.dz.over{border-color:var(--pri);background:var(--mutedbg)}.dzin{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;color:var(--muted)}
.dz .prev{width:100%;height:200px;object-fit:contain;background:#000;display:block}
.thumb{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0b0b0f;border-radius:10px;display:block}
.tile{border:1px solid var(--line);border-radius:12px;padding:.8rem;background:var(--card)}.tile.add{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5rem;color:var(--muted);border-style:dashed;min-height:180px}
.issues{margin:.4rem 0 0;padding-left:1.1rem;font-size:.85rem;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:20;overflow:auto;padding:2rem 1rem;backdrop-filter:blur(3px)}
.sheet{max-width:1100px;margin:0 auto;background:var(--bg);border-radius:18px;padding:1.5rem;position:relative}
.x{position:absolute;right:1rem;top:1rem;border:0;background:var(--card);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;box-shadow:var(--shadow)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.25rem}@media(max-width:900px){.split{grid-template-columns:1fr}}
.notice{background:var(--warnbg);color:var(--warn);padding:.6rem .8rem;border-radius:10px;font-size:.82rem;margin:.75rem 0}
.dis{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 60px;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
.review{border-left:3px solid var(--pri);padding:.4rem .8rem;margin:.5rem 0;background:var(--card);border-radius:0 8px 8px 0}
.big-n{font-size:2.4rem;font-weight:800;line-height:1}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--mutedbg),var(--card),var(--mutedbg));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:1rem}@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;right:1rem;bottom:1rem;z-index:50;display:flex;flex-direction:column;gap:.5rem}.t{padding:.7rem 1rem;border-radius:10px;color:#fff;box-shadow:var(--shadow);max-width:360px;font-size:.9rem}.t.ok{background:#047857}.t.err{background:#b91c1c}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => (x * 100).toFixed(1) + '%';
const fmt = iso => iso ? new Date(iso).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—';
const fmtD = d => d ? new Date(d + 'T00:00:00').toLocaleDateString([], {dateStyle:'medium'}) : '—';
const badge = (t, k) => `<span class="badge ${k}">${esc(t)}</span>`;
const qBadge = s => badge(s === 'pass' ? 'Quality OK' : s === 'warn' ? 'Quality warning' : 'Quality failed', s === 'pass' ? 'ok' : s === 'warn' ? 'warn' : 'bad');
const aBadge = s => ({completed: badge('Analysed','info'), pending: badge('Awaiting analysis','muted'), failed: badge('Analysis failed','bad'), skipped_quality: badge('Retake needed','bad')})[s] || '';
const rBadge = s => s === 'reviewed' ? badge('Reviewed','ok') : s === 'pending' ? badge('Awaiting review','warn') : '';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : '';
const EYE = {left:'Left eye', right:'Right eye'};
const state = { api: localStorage.getItem('api') || 'http://localhost:8000', token: sessionStorage.getItem('token'), me: null, view: null };
const dash = { status:'pending_review', eye:'', abnormal:'', needs_review:'', q:'', sort:'priority', page:1 };
const pagers = {};            // ctx -> fn(page)
let qitems = new Map();       // image_id -> queue item (for patient context)
let ctxPatient = null;

function toast(msg, kind = 'ok') {
  const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
const fmtErr = d => Array.isArray(d) ? d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ') : (typeof d === 'string' ? d : '');
async function api(path, {method = 'GET', json, form, params, raw} = {}) {
  const url = new URL(state.api + '/api/v1' + path);
  for (const [k, v] of Object.entries(params || {})) if (v !== '' && v != null) url.searchParams.set(k, v);
  const headers = {}; let body;
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  if (json) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(json); } else if (form) body = form;
  let r;
  try { r = await fetch(url, {method, headers, body}); }
  catch { throw new Error(`Cannot reach the server at ${state.api}. Is it running, and is CORS configured (OPH_CORS_ORIGINS)?`); }
  if (r.status === 401 && state.token) { logout(); throw new Error('Session expired. Please sign in again.'); }
  if (!r.ok) { let d; try { d = (await r.json()).detail; } catch {} throw new Error(fmtErr(d) || r.statusText); }
  if (raw) return r;
  return r.status === 204 ? null : r.json();
}
const safe = fn => Promise.resolve().then(fn).catch(e => toast(e.message, 'err'));

const blobCache = new Map();
async function blobUrl(id, max) {
  const k = id + ':' + max; if (blobCache.has(k)) return blobCache.get(k);
  const r = await api(`/images/${id}/file`, {params: max ? {max_side: max} : {}, raw: true});
  const u = URL.createObjectURL(await r.blob()); blobCache.set(k, u); return u;
}
function hydrate(root = document) {
  root.querySelectorAll('img[data-img]:not([src])').forEach(async im => {
    try { im.src = await blobUrl(im.dataset.img, Number(im.dataset.max || 0)); } catch { im.alt = 'Image unavailable'; }
  });
}
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet"><button class="x" data-act="close" aria-label="Close">✕</button>${html}</div>`; m.hidden = false; document.body.style.overflow = 'hidden'; hydrate(m); }
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; document.body.style.overflow = ''; }
function logout() {
  sessionStorage.removeItem('token'); state.token = null; state.me = null; state.view = null;
  blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear(); closeModal(); render();
}

/* ============ auth ============ */
function renderAuth(mode = 'login') {
  const login = `<form data-form="login"><label class="f"><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
    <label class="f"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%" type="submit">Sign in</button>
    <p class="muted small" style="margin-top:1rem">Doctor accounts are created by your administrator.</p></form>`;
  const reg = `<form data-form="register"><label class="f"><span>Full name</span><input name="full_name" required></label>
    <label class="f"><span>Email</span><input name="email" type="email" required></label>
    <div class="grid2"><label class="f"><span>Date of birth</span><input name="date_of_birth" type="date" required max="${new Date().toISOString().slice(0,10)}"></label>
    <label class="f"><span>Sex</span><select name="sex"><option value="unknown">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></label></div>
    <label class="f"><span>Password (min. 10 characters)</span><input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="btn pri" style="width:100%" type="submit">Create patient account</button></form>`;
  $('#app').innerHTML = `<div class="auth"><section class="hero"><div class="brand" style="margin-bottom:2rem"><span class="logo">${eyeSvg(20)}</span>OphthaScreen</div>
    <h1>AI-assisted fundus screening</h1><p style="opacity:.9">Upload retinal images, get an automatic quality check, and let clinicians review the AI result.</p>
    <ul><li>Left &amp; right eye upload</li><li>Automatic image-quality check</li><li>ConvNeXt-Tiny screening model</li><li>Doctor review dashboard</li></ul>
    <p class="small" style="opacity:.75;margin-top:2rem">Research prototype. Not a medical device; not for diagnosis.</p></section>
    <section class="authcard"><div class="tabs2"><button data-act="authtab" data-mode="login" class="${mode==='login'?'on':''}">Sign in</button>
    <button data-act="authtab" data-mode="register" class="${mode==='register'?'on':''}">Patient sign-up</button></div>${mode === 'login' ? login : reg}
    <details class="srv"><summary>Server settings</summary><label class="f" style="margin-top:.6rem"><span>API URL</span><input id="apiurl" value="${esc(state.api)}"></label></details></section></div>`;
}
const eyeSvg = n => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;

async function doLogin(email, password) {
  const t = await api('/auth/login', {method: 'POST', form: new URLSearchParams({username: email, password})});
  state.token = t.access_token; sessionStorage.setItem('token', t.access_token);
  state.me = await api('/auth/me');
  state.view = state.me.role === 'doctor' ? {name: 'dashboard'} : {name: 'upload', pid: state.me.patient_id};
  render();
}

/* ============ shell / routing ============ */
function render() { if (!state.me) return renderAuth(); renderShell(); }
function renderShell() {
  const doc = state.me.role === 'doctor';
  const nav = doc ? [['dashboard','Dashboard'], ['patients','Patients']] : [['upload','Upload images'], ['history','My history']];
  const active = state.view.name === 'patient' ? 'patients' : state.view.name;
  $('#app').innerHTML = `<header class="top"><div class="brand"><span class="logo">${eyeSvg(18)}</span>OphthaScreen</div>
    <div class="who"><span class="chip">${esc(state.me.full_name)} · ${esc(state.me.role)}</span><button class="btn sm" data-act="logout">Sign out</button></div></header>
    <div class="wrap"><nav class="tabs">${nav.map(([k, l]) => `<button data-act="tab" data-v="${k}" class="${active === k ? 'on' : ''}">${l}</button>`).join('')}</nav><main id="main"></main></div>
    <footer>Research prototype — not a medical device and not clinically validated. AI output is decision support only and never replaces review by a qualified clinician.</footer>`;
  $('#main').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const v = VIEWS[state.view.name];
  safe(() => v(state.view)).then(() => hydrate($('#main')));
}
function go(view) { state.view = view; renderShell(); }

/* ============ shared renderers ============ */
function dz(name, label) {
  return `<label class="dz"><input type="file" name="${name}" accept="image/png,image/jpeg" hidden>
    <div class="dzin">${eyeSvg(30)}<strong>${label}</strong><span class="small">Click or drop a JPEG/PNG</span></div><img class="prev" hidden alt=""></label>`;
}
function tile(i, role) {
  const fail = i.quality.status === 'fail';
  const issues = i.quality.issues.length ? `<ul class="issues">${i.quality.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : '';
  const hint = role === 'patient' && fail ? '<p class="small" style="color:var(--bad)">This image could not be used. Please retake and upload a clearer photo.</p>' : '';
  const ai = i.prediction ? `<p class="small">AI risk: <b>${pct(i.prediction.risk_probability)}</b></p>` : '';
  return `<div class="tile"><img class="thumb" data-img="${esc(i.id)}" data-max="500" alt="${esc(EYE[i.eye])}">
    <div class="row between" style="margin:.6rem 0 .3rem"><strong>${EYE[i.eye]}</strong><span class="small muted">${fmt(i.uploaded_at)}</span></div>
    <div class="chips">${qBadge(i.quality.status)}${aBadge(i.analysis_status)}${rBadge(i.review_status)}</div>${issues}${hint}${ai}
    <div class="row" style="margin-top:.7rem">${role === 'doctor' ? `<button class="btn sm" data-act="open" data-id="${esc(i.id)}">Open</button>` : ''}
    <label class="btn sm">Replace image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(i.screening_id)}" data-eye="${i.eye}"></label></div></div>`;
}
function addTile(sid, eye) {
  return `<div class="tile add"><strong>${EYE[eye]}</strong><span class="small">No image yet</span>
    <label class="btn sm">Add image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(sid)}" data-eye="${eye}"></label></div>`;
}
function screeningCard(s, role) {
  const have = new Set(s.images.map(i => i.eye));
  const tiles = ['left', 'right'].map(e => have.has(e) ? tile(s.images.find(i => i.eye === e), role) : addTile(s.id, e)).join('');
  return `<div class="card"><div class="row between"><h3>Screening · ${fmt(s.created_at)}</h3><span class="muted small">ID ${esc(s.id.slice(0, 8))}</span></div><div class="grid2">${tiles}</div></div>`;
}
function pager(ctx, page, size, total) {
  const pages = Math.max(1, Math.ceil(total / size));
  return `<div class="pager"><span>${total} item${total === 1 ? '' : 's'}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
    <span>Page ${page} / ${pages}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next ›</button></div>`;
}

/* ============ patient views ============ */
async function viewUpload({pid, back}) {
  $('#main').innerHTML = `${back ? '<button class="link" data-act="back">← Back</button>' : ''}
    <div class="card"><h2>New screening</h2><p class="muted">Upload a left and/or right fundus photo (JPEG or PNG, up to 25 MB each). Images are quality-checked automatically.</p>
    <form data-form="upload" data-pid="${esc(pid)}"><div class="grid2">${dz('left_image', 'Left eye')}${dz('right_image', 'Right eye')}</div>
    <div class="row end" style="margin-top:1rem"><button class="btn pri" type="submit">Upload &amp; analyse</button></div></form></div><div id="upres"></div>`;
}
async function viewHistory({pid, page = 1, host}) {
  const box = host || $('#main');
  const h = await api(`/patients/${pid}/screenings`, {params: {page, size: 5}});
  const role = state.me.role;
  box.innerHTML = (host ? '' : '<h2>My history</h2>') + (h.items.length ? h.items.map(s => screeningCard(s, role)).join('') + pager('hist', h.page, h.size, h.total)
    : '<div class="card empty">No screenings yet.</div>');
  pagers.hist = p => safe(() => viewHistory({pid, page: p, host}).then(() => hydrate(box)));
}

/* ============ doctor: dashboard ============ */
async function viewDashboard() {
  $('#main').innerHTML = `<div id="sumbox"></div><div class="card"><div class="filters">
    <input type="search" data-filter="q" placeholder="Search patient name or MRN…" value="${esc(dash.q)}">
    <select data-filter="status"><option value="pending_review">Pending review</option><option value="reviewed">Reviewed</option><option value="quality_failed">Quality failed</option><option value="analysis_incomplete">Analysis incomplete</option><option value="all">All</option></select>
    <select data-filter="eye"><option value="">Both eyes</option><option value="left">Left</option><option value="right">Right</option></select>
    <select data-filter="abnormal"><option value="">Any AI result</option><option value="true">AI-flagged abnormal</option><option value="false">AI not flagged</option></select>
    <select data-filter="needs_review"><option value="">Any confidence</option><option value="true">Model uncertain</option><option value="false">Model confident</option></select>
    <select data-filter="sort"><option value="priority">Sort: priority</option><option value="risk">Sort: risk</option><option value="newest">Sort: newest</option></select></div>
    <div id="qbox"><div class="skel"></div></div></div>`;
  document.querySelectorAll('[data-filter]').forEach(el => { if (el.tagName === 'SELECT') el.value = dash[el.dataset.filter]; });
  pagers.queue = p => { dash.page = p; loadQueue(); };
  await Promise.all([loadSummary(), loadQueue()]);
}
async function loadSummary() {
  const s = await api('/dashboard/summary');
  const c = (n, l, st, extra = {}, on = false) => `<button class="stat ${on ? 'on' : ''}" data-act="card" data-st="${st}" data-x='${JSON.stringify(extra)}'><b>${n}</b><span>${l}</span></button>`;
  $('#sumbox').innerHTML = `<div class="stats">${c(s.pending_review, 'Pending review', 'pending_review', {}, dash.status === 'pending_review' && !dash.abnormal && !dash.needs_review)}
    ${c(s.pending_flagged_abnormal, 'AI-flagged abnormal', 'pending_review', {abnormal: 'true'}, dash.abnormal === 'true')}
    ${c(s.pending_model_uncertain, 'Model uncertain', 'pending_review', {needs_review: 'true'}, dash.needs_review === 'true')}
    ${c(s.reviewed_today_utc, 'Reviewed today', 'reviewed')}${c(s.quality_failed, 'Quality failed', 'quality_failed')}${c(s.analysis_incomplete, 'Analysis incomplete', 'analysis_incomplete')}</div>`;
}
async function loadQueue() {
  const q = await api('/dashboard/queue', {params: {...dash, size: 15}});
  qitems = new Map(q.items.map(i => [i.image_id, i]));
  const risk = i => i.risk_probability == null ? '<span class="muted">—</span>' :
    `<div class="rk"><div class="bar sm"><i class="${i.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(i.risk_probability)}"></i></div><span>${pct(i.risk_probability)}</span></div>`;
  const rows = q.items.map(i => `<tr data-act="open" data-id="${esc(i.image_id)}"><td><strong>${esc(i.patient.full_name)}</strong><div class="small muted">${esc(i.patient.medical_record_number || '—')}</div></td>
    <td>${EYE[i.eye]}</td><td>${risk(i)}</td><td><div class="chips">${i.risk_probability == null ? '' : i.risk_abnormal_screening ? (i.flagged_diseases.length ? i.flagged_diseases.map(d => badge((i.flagged_disease_names || {})[d] || d, 'bad')).join('') : '<span class="small muted">Doctor review recommended</span>') : '<span class="small muted">No significant abnormality flagged</span>'}${i.needs_review ? badge('Uncertain', 'warn') : ''}</div></td>
    <td>${qBadge(i.quality_status)}${i.quality_issue_codes.length ? `<div class="small muted">${esc(i.quality_issue_codes.map(cap).join(', '))}</div>` : ''}</td>
    <td>${i.review_status ? rBadge(i.review_status) : aBadge(i.analysis_status)}${i.last_review ? `<div class="small muted">${esc(cap(i.last_review.decision))}</div>` : ''}</td><td class="small">${fmt(i.uploaded_at)}</td></tr>`).join('');
  $('#qbox').innerHTML = q.items.length ? `<div class="tw"><table><thead><tr><th>Patient</th><th>Eye</th><th>AI risk</th><th>Flags</th><th>Image quality</th><th>Status</th><th>Uploaded</th></tr></thead><tbody>${rows}</tbody></table></div>${pager('queue', q.page, q.size, q.total)}`
    : '<div class="empty">Nothing here. 🎉</div>';
}

/* ============ doctor: image detail & review ============ */
async function openDetail(id, patient) {
  openModal('<div class="skel"></div><div class="skel"></div>');
  const i = await api('/images/' + id);
  const p = i.prediction, q = i.quality;
  const patientLine = patient ? `<p class="muted">${esc(patient.full_name)} · ${esc(patient.medical_record_number || 'no MRN')} · DOB ${fmtD(patient.date_of_birth)} · ${esc(cap(patient.sex))}</p>` : '';
  let ai = '<p class="muted">No AI result for this image.</p>';
  if (p) {
    const t = p.risk_thresholds, core = p.diseases.filter(d => d.validated), other = p.diseases.filter(d => !d.validated).slice(0, 10);
    const row = d => `<div class="dis"><span>${d.flagged ? '🚩 ' : ''}<strong>${esc(d.name || d.code)}</strong>${d.name ? ` <span class="small muted">(${esc(d.code)})</span>` : ''}</span><div class="bar sm" style="width:100%"><i class="${d.flagged ? 'hi' : ''}" style="width:${pct(d.probability)}"></i></div><span class="right">${pct(d.probability)}</span></div>`;
    ai = `<div class="row" style="gap:1.5rem"><div><div class="big-n">${pct(p.risk_probability)}</div><div class="small muted">abnormal-risk probability</div></div>
      <div class="chips">${p.risk_abnormal_screening ? badge('Doctor review recommended', 'bad') : badge('Below screening threshold', 'ok')}${p.risk_abnormal_max_f1 ? badge('Above max-F1 threshold', 'warn') : ''}${p.needs_review ? badge('Model uncertain — review', 'warn') : ''}</div></div>
      <div class="bar big"><i class="${p.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(p.risk_probability)}"></i><b style="left:${pct(t.screening)}"><em>screening ${t.screening.toFixed(2)}</em></b><b style="left:${pct(t.max_f1)}"><em>max-F1 ${t.max_f1.toFixed(2)}</em></b></div>

/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => (x * 100).toFixed(1) + '%';
const fmt = iso => iso ? new Date(iso).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—';
const fmtD = d => d ? new Date(d + 'T00:00:00').toLocaleDateString([], {dateStyle:'medium'}) : '—';
const badge = (t, k) => `<span class="badge ${k}">${esc(t)}</span>`;
const qBadge = s => badge(s === 'pass' ? 'Quality OK' : s === 'warn' ? 'Quality warning' : 'Quality failed', s === 'pass' ? 'ok' : s === 'warn' ? 'warn' : 'bad');
const aBadge = s => ({completed: badge('Analysed','info'), pending: badge('Awaiting analysis','muted'), failed: badge('Analysis failed','bad'), skipped_quality: badge('Retake needed','bad')})[s] || '';
const rBadge = s => s === 'reviewed' ? badge('Reviewed','ok') : s === 'pending' ? badge('Awaiting review','warn') : '';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : '';
const EYE = {left:'Left eye', right:'Right eye'};
const state = { api: localStorage.getItem('api') || 'http://localhost:8000', token: sessionStorage.getItem('token'), me: null, view: null };
const dash = { status:'pending_review', eye:'', abnormal:'', needs_review:'', q:'', sort:'priority', page:1 };
const pagers = {};            // ctx -> fn(page)
let qitems = new Map();       // image_id -> queue item (for patient context)
let ctxPatient = null;

function toast(msg, kind = 'ok') {
  const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
const fmtErr = d => Array.isArray(d) ? d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ') : (typeof d === 'string' ? d : '');
async function api(path, {method = 'GET', json, form, params, raw} = {}) {
  const url = new URL(state.api + '/api/v1' + path);
  for (const [k, v] of Object.entries(params || {})) if (v !== '' && v != null) url.searchParams.set(k, v);
  const headers = {}; let body;
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  if (json) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(json); } else if (form) body = form;
  let r;
  try { r = await fetch(url, {method, headers, body}); }
  catch { throw new Error(`Cannot reach the server at ${state.api}. Is it running, and is CORS configured (OPH_CORS_ORIGINS)?`); }
  if (r.status === 401 && state.token) { logout(); throw new Error('Session expired. Please sign in again.'); }
  if (!r.ok) { let d; try { d = (await r.json()).detail; } catch {} throw new Error(fmtErr(d) || r.statusText); }
  if (raw) return r;
  return r.status === 204 ? null : r.json();
}
const safe = fn => Promise.resolve().then(fn).catch(e => toast(e.message, 'err'));

const blobCache = new Map();
async function blobUrl(id, max) {
  const k = id + ':' + max; if (blobCache.has(k)) return blobCache.get(k);
  const r = await api(`/images/${id}/file`, {params: max ? {max_side: max} : {}, raw: true});
  const u = URL.createObjectURL(await r.blob()); blobCache.set(k, u); return u;
}
function hydrate(root = document) {
  root.querySelectorAll('img[data-img]:not([src])').forEach(async im => {
    try { im.src = await blobUrl(im.dataset.img, Number(im.dataset.max || 0)); } catch { im.alt = 'Image unavailable'; }
  });
}
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet"><button class="x" data-act="close" aria-label="Close">✕</button>${html}</div>`; m.hidden = false; document.body.style.overflow = 'hidden'; hydrate(m); }
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; document.body.style.overflow = ''; }
function logout() {
  sessionStorage.removeItem('token'); state.token = null; state.me = null; state.view = null;
  blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear(); closeModal(); render();
}

/* ============ auth ============ */
function renderAuth(mode = 'login') {
  const login = `<form data-form="login"><label class="f"><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
    <label class="f"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%" type="submit">Sign in</button>
    <p class="muted small" style="margin-top:1rem">Doctor accounts are created by your administrator.</p></form>`;
  const reg = `<form data-form="register"><label class="f"><span>Full name</span><input name="full_name" required></label>
    <label class="f"><span>Email</span><input name="email" type="email" required></label>
    <div class="grid2"><label class="f"><span>Date of birth</span><input name="date_of_birth" type="date" required max="${new Date().toISOString().slice(0,10)}"></label>
    <label class="f"><span>Sex</span><select name="sex"><option value="unknown">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></label></div>
    <label class="f"><span>Password (min. 10 characters)</span><input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="btn pri" style="width:100%" type="submit">Create patient account</button></form>`;
  $('#app').innerHTML = `<div class="auth"><section class="hero"><div class="brand" style="margin-bottom:2rem"><span class="logo">${eyeSvg(20)}</span>OphthaScreen</div>
    <h1>AI-assisted fundus screening</h1><p style="opacity:.9">Upload retinal images, get an automatic quality check, and let clinicians review the AI result.</p>
    <ul><li>Left &amp; right eye upload</li><li>Automatic image-quality check</li><li>ConvNeXt-Tiny screening model</li><li>Doctor review dashboard</li></ul>
    <p class="small" style="opacity:.75;margin-top:2rem">Research prototype. Not a medical device; not for diagnosis.</p></section>
    <section class="authcard"><div class="tabs2"><button data-act="authtab" data-mode="login" class="${mode==='login'?'on':''}">Sign in</button>
    <button data-act="authtab" data-mode="register" class="${mode==='register'?'on':''}">Patient sign-up</button></div>${mode === 'login' ? login : reg}
    <details class="srv"><summary>Server settings</summary><label class="f" style="margin-top:.6rem"><span>API URL</span><input id="apiurl" value="${esc(state.api)}"></label></details></section></div>`;
}
const eyeSvg = n => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;

async function doLogin(email, password) {
  const t = await api('/auth/login', {method: 'POST', form: new URLSearchParams({username: email, password})});
  state.token = t.access_token; sessionStorage.setItem('token', t.access_token);
  state.me = await api('/auth/me');
  state.view = state.me.role === 'doctor' ? {name: 'dashboard'} : {name: 'upload', pid: state.me.patient_id};
  render();
}

/* ============ shell / routing ============ */
function render() { if (!state.me) return renderAuth(); renderShell(); }
function renderShell() {
  const doc = state.me.role === 'doctor';
  const nav = doc ? [['dashboard','Dashboard'], ['patients','Patients']] : [['upload','Upload images'], ['history','My history']];
  const active = state.view.name === 'patient' ? 'patients' : state.view.name;
  $('#app').innerHTML = `<header class="top"><div class="brand"><span class="logo">${eyeSvg(18)}</span>OphthaScreen</div>
    <div class="who"><span class="chip">${esc(state.me.full_name)} · ${esc(state.me.role)}</span><button class="btn sm" data-act="logout">Sign out</button></div></header>
    <div class="wrap"><nav class="tabs">${nav.map(([k, l]) => `<button data-act="tab" data-v="${k}" class="${active === k ? 'on' : ''}">${l}</button>`).join('')}</nav><main id="main"></main></div>
    <footer>Research prototype — not a medical device and not clinically validated. AI output is decision support only and never replaces review by a qualified clinician.</footer>`;
  $('#main').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const v = VIEWS[state.view.name];
  safe(() => v(state.view)).then(() => hydrate($('#main')));
}
function go(view) { state.view = view; renderShell(); }

/* ============ shared renderers ============ */
function dz(name, label) {
  return `<label class="dz"><input type="file" name="${name}" accept="image/png,image/jpeg" hidden>
    <div class="dzin">${eyeSvg(30)}<strong>${label}</strong><span class="small">Click or drop a JPEG/PNG</span></div><img class="prev" hidden alt=""></label>`;
}
function tile(i, role) {
  const fail = i.quality.status === 'fail';
  const issues = i.quality.issues.length ? `<ul class="issues">${i.quality.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : '';
  const hint = role === 'patient' && fail ? '<p class="small" style="color:var(--bad)">This image could not be used. Please retake and upload a clearer photo.</p>' : '';
  const ai = i.prediction ? `<p class="small">AI risk: <b>${pct(i.prediction.risk_probability)}</b></p>` : '';
  return `<div class="tile"><img class="thumb" data-img="${esc(i.id)}" data-max="500" alt="${esc(EYE[i.eye])}">
    <div class="row between" style="margin:.6rem 0 .3rem"><strong>${EYE[i.eye]}</strong><span class="small muted">${fmt(i.uploaded_at)}</span></div>
    <div class="chips">${qBadge(i.quality.status)}${aBadge(i.analysis_status)}${rBadge(i.review_status)}</div>${issues}${hint}${ai}
    <div class="row" style="margin-top:.7rem">${role === 'doctor' ? `<button class="btn sm" data-act="open" data-id="${esc(i.id)}">Open</button>` : ''}
    <label class="btn sm">Replace image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(i.screening_id)}" data-eye="${i.eye}"></label></div></div>`;
}
function addTile(sid, eye) {
  return `<div class="tile add"><strong>${EYE[eye]}</strong><span class="small">No image yet</span>
    <label class="btn sm">Add image<input type="file" hidden accept="image/png,image/jpeg" data-retake data-sid="${esc(sid)}" data-eye="${eye}"></label></div>`;
}
function screeningCard(s, role) {
  const have = new Set(s.images.map(i => i.eye));
  const tiles = ['left', 'right'].map(e => have.has(e) ? tile(s.images.find(i => i.eye === e), role) : addTile(s.id, e)).join('');
  return `<div class="card"><div class="row between"><h3>Screening · ${fmt(s.created_at)}</h3><span class="muted small">ID ${esc(s.id.slice(0, 8))}</span></div><div class="grid2">${tiles}</div></div>`;
}
function pager(ctx, page, size, total) {
  const pages = Math.max(1, Math.ceil(total / size));
  return `<div class="pager"><span>${total} item${total === 1 ? '' : 's'}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
    <span>Page ${page} / ${pages}</span><button class="btn sm" data-act="page" data-ctx="${ctx}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next ›</button></div>`;
}

/* ============ patient views ============ */
async function viewUpload({pid, back}) {
  $('#main').innerHTML = `${back ? '<button class="link" data-act="back">← Back</button>' : ''}
    <div class="card"><h2>New screening</h2><p class="muted">Upload a left and/or right fundus photo (JPEG or PNG, up to 25 MB each). Images are quality-checked automatically.</p>
    <form data-form="upload" data-pid="${esc(pid)}"><div class="grid2">${dz('left_image', 'Left eye')}${dz('right_image', 'Right eye')}</div>
    <div class="row end" style="margin-top:1rem"><button class="btn pri" type="submit">Upload &amp; analyse</button></div></form></div><div id="upres"></div>`;
}
async function viewHistory({pid, page = 1, host}) {
  const box = host || $('#main');
  const h = await api(`/patients/${pid}/screenings`, {params: {page, size: 5}});
  const role = state.me.role;
  box.innerHTML = (host ? '' : '<h2>My history</h2>') + (h.items.length ? h.items.map(s => screeningCard(s, role)).join('') + pager('hist', h.page, h.size, h.total)
    : '<div class="card empty">No screenings yet.</div>');
  pagers.hist = p => safe(() => viewHistory({pid, page: p, host}).then(() => hydrate(box)));
}

/* ============ doctor: dashboard ============ */
async function viewDashboard() {
  $('#main').innerHTML = `<div id="sumbox"></div><div class="card"><div class="filters">
    <input type="search" data-filter="q" placeholder="Search patient name or MRN…" value="${esc(dash.q)}">
    <select data-filter="status"><option value="pending_review">Pending review</option><option value="reviewed">Reviewed</option><option value="quality_failed">Quality failed</option><option value="analysis_incomplete">Analysis incomplete</option><option value="all">All</option></select>
    <select data-filter="eye"><option value="">Both eyes</option><option value="left">Left</option><option value="right">Right</option></select>
    <select data-filter="abnormal"><option value="">Any AI result</option><option value="true">AI-flagged abnormal</option><option value="false">AI not flagged</option></select>
    <select data-filter="needs_review"><option value="">Any confidence</option><option value="true">Model uncertain</option><option value="false">Model confident</option></select>
    <select data-filter="sort"><option value="priority">Sort: priority</option><option value="risk">Sort: risk</option><option value="newest">Sort: newest</option></select></div>
    <div id="qbox"><div class="skel"></div></div></div>`;
  document.querySelectorAll('[data-filter]').forEach(el => { if (el.tagName === 'SELECT') el.value = dash[el.dataset.filter]; });
  pagers.queue = p => { dash.page = p; loadQueue(); };
  await Promise.all([loadSummary(), loadQueue()]);
}
async function loadSummary() {
  const s = await api('/dashboard/summary');
  const c = (n, l, st, extra = {}, on = false) => `<button class="stat ${on ? 'on' : ''}" data-act="card" data-st="${st}" data-x='${JSON.stringify(extra)}'><b>${n}</b><span>${l}</span></button>`;
  $('#sumbox').innerHTML = `<div class="stats">${c(s.pending_review, 'Pending review', 'pending_review', {}, dash.status === 'pending_review' && !dash.abnormal && !dash.needs_review)}
    ${c(s.pending_flagged_abnormal, 'AI-flagged abnormal', 'pending_review', {abnormal: 'true'}, dash.abnormal === 'true')}
    ${c(s.pending_model_uncertain, 'Model uncertain', 'pending_review', {needs_review: 'true'}, dash.needs_review === 'true')}
    ${c(s.reviewed_today_utc, 'Reviewed today', 'reviewed')}${c(s.quality_failed, 'Quality failed', 'quality_failed')}${c(s.analysis_incomplete, 'Analysis incomplete', 'analysis_incomplete')}</div>`;
}
async function loadQueue() {
  const q = await api('/dashboard/queue', {params: {...dash, size: 15}});
  qitems = new Map(q.items.map(i => [i.image_id, i]));
  const risk = i => i.risk_probability == null ? '<span class="muted">—</span>' :
    `<div class="rk"><div class="bar sm"><i class="${i.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(i.risk_probability)}"></i></div><span>${pct(i.risk_probability)}</span></div>`;
  const rows = q.items.map(i => `<tr data-act="open" data-id="${esc(i.image_id)}"><td><strong>${esc(i.patient.full_name)}</strong><div class="small muted">${esc(i.patient.medical_record_number || '—')}</div></td>
    <td>${EYE[i.eye]}</td><td>${risk(i)}</td><td><div class="chips">${i.risk_probability == null ? '' : i.risk_abnormal_screening ? (i.flagged_diseases.length ? i.flagged_diseases.map(d => badge((i.flagged_disease_names || {})[d] || d, 'bad')).join('') : '<span class="small muted">Doctor review recommended</span>') : '<span class="small muted">No significant abnormality flagged</span>'}${i.needs_review ? badge('Uncertain', 'warn') : ''}</div></td>
    <td>${qBadge(i.quality_status)}${i.quality_issue_codes.length ? `<div class="small muted">${esc(i.quality_issue_codes.map(cap).join(', '))}</div>` : ''}</td>
    <td>${i.review_status ? rBadge(i.review_status) : aBadge(i.analysis_status)}${i.last_review ? `<div class="small muted">${esc(cap(i.last_review.decision))}</div>` : ''}</td><td class="small">${fmt(i.uploaded_at)}</td></tr>`).join('');
  $('#qbox').innerHTML = q.items.length ? `<div class="tw"><table><thead><tr><th>Patient</th><th>Eye</th><th>AI risk</th><th>Flags</th><th>Image quality</th><th>Status</th><th>Uploaded</th></tr></thead><tbody>${rows}</tbody></table></div>${pager('queue', q.page, q.size, q.total)}`
    : '<div class="empty">Nothing here. 🎉</div>';
}

/* ============ doctor: image detail & review ============ */
async function openDetail(id, patient) {
  openModal('<div class="skel"></div><div class="skel"></div>');
  const i = await api('/images/' + id);
  const p = i.prediction, q = i.quality;
  const patientLine = patient ? `<p class="muted">${esc(patient.full_name)} · ${esc(patient.medical_record_number || 'no MRN')} · DOB ${fmtD(patient.date_of_birth)} · ${esc(cap(patient.sex))}</p>` : '';
  let ai = '<p class="muted">No AI result for this image.</p>';
  if (p) {
    const t = p.risk_thresholds, core = p.diseases.filter(d => d.validated), other = p.diseases.filter(d => !d.validated).slice(0, 10);
    const row = d => `<div class="dis"><span>${d.flagged ? '🚩 ' : ''}<strong>${esc(d.name || d.code)}</strong>${d.name ? ` <span class="small muted">(${esc(d.code)})</span>` : ''}</span><div class="bar sm" style="width:100%"><i class="${d.flagged ? 'hi' : ''}" style="width:${pct(d.probability)}"></i></div><span class="right">${pct(d.probability)}</span></div>`;
    ai = `<div class="row" style="gap:1.5rem"><div><div class="big-n">${pct(p.risk_probability)}</div><div class="small muted">abnormal-risk probability</div></div>
      <div class="chips">${p.risk_abnormal_screening ? badge('Doctor review recommended', 'bad') : badge('Below screening threshold', 'ok')}${p.risk_abnormal_max_f1 ? badge('Above max-F1 threshold', 'warn') : ''}${p.needs_review ? badge('Model uncertain — review', 'warn') : ''}</div></div>
      <div class="bar big"><i class="${p.risk_abnormal_screening ? 'hi' : ''}" style="width:${pct(p.risk_probability)}"></i><b style="left:${pct(t.screening)}"><em>screening ${t.screening.toFixed(2)}</em></b><b style="left:${pct(t.max_f1)}"><em>max-F1 ${t.max_f1.toFixed(2)}</em></b></div>
      <p class="small muted">Model confidence ${p.risk_confidence.toFixed(2)} · ${esc(p.model_tag)} · ${fmt(p.created_at)}</p>${p.warnings.length ? `<div class="notice">Model warnings: ${esc(p.warnings.join(', '))}</div>` : ''}
      ${p.risk_abnormal_screening ? `<h4 style="margin-top:1rem">Highest-probability validated RFMiD abnormalities</h4>${p.top_abnormalities.map(row).join('')}` : `<div class="notice" style="margin-top:1rem"><strong>${esc(p.screening_message)}</strong></div>`}
      <details style="margin-top:.8rem"><summary class="small muted">All validated RFMiD classes (separate from Disease_Risk)</summary>${core.map(row).join('')}</details>
      <details style="margin-top:.8rem"><summary class="small muted">Other classes — probabilities only, not validated</summary>${other.map(row).join('')}</details><div class="notice">${esc(p.notice)}</div>`;
  }
  const m = q.metrics ? `<details><summary class="small muted">Quality metrics</summary><table class="small">${Object.entries(q.metrics).map(([k, v]) => `<tr><td>${esc(cap(k))}</td><td>${esc(v)}</td></tr>`).join('')}</table></details>` : '';
  const reviews = i.reviews.length ? i.reviews.map(r => `<div class="review"><strong>${esc(cap(r.decision))}</strong>${r.impression ? ' · impression: ' + esc(r.impression) : ''}<div class="small muted">${esc(r.doctor_name || 'Doctor')} · ${fmt(r.created_at)}</div>${r.comment ? `<div>${esc(r.comment)}</div>` : ''}</div>`).join('') : '<p class="muted small">No reviews yet.</p>';
  const form = p ? `<form data-form="review" data-pid="${esc(p.id)}" data-iid="${esc(i.id)}"><div class="grid2"><label class="f"><span>Decision</span><select name="decision"><option value="agree">Agree with AI</option><option value="disagree">Disagree with AI</option><option value="needs_retake">Needs retake</option><option value="inconclusive">Inconclusive</option></select></label>
    <label class="f"><span>Your impression</span><select name="impression"><option value="">—</option><option value="normal">Normal</option><option value="abnormal">Abnormal</option><option value="ungradable">Ungradable</option></select></label></div>
    <label class="f"><span>Comment (max 2000 chars)</span><textarea name="comment" rows="3" maxlength="2000"></textarea></label><button class="btn pri" type="submit">Save review</button></form>` : '';
  const gcCore = p ? p.diseases.filter(d => d.validated) : [], gcCodes = [...new Set([...gcCore.filter(d => d.flagged), ...gcCore.slice(0, 3)].map(d => d.code))];
  const gcCard = p && p.crop_ok ? `<div class="card"><h4>Attention map (Grad-CAM)</h4><p class="small muted" style="margin-top:0">Where the image pushed the selected score up. Computed on demand.</p><div class="row"><select id="gc-target" style="flex:1;min-width:200px"><option value="risk">Abnormal-risk score</option>${gcCodes.map(c => { const d = gcCore.find(x => x.code === c); return `<option value="${esc(c)}">${esc(d.name || c)} (${esc(c)})</option>`; }).join('')}</select><button class="btn sm" data-act="gradcam" data-id="${esc(i.id)}">Show map</button></div><div id="gc-out"></div></div>` : '';
  const rerun = i.quality.status !== 'fail' && i.analysis_status !== 'completed' ? `<button class="btn sm" data-act="analyze" data-id="${esc(i.id)}">Run analysis</button>` : '';
  $('#modal .sheet').innerHTML = `<button class="x" data-act="close" aria-label="Close">✕</button><h2>${EYE[i.eye]} · ${fmt(i.uploaded_at)}</h2>${patientLine}
    <div class="split"><div><div class="card"><img class="thumb" data-img="${esc(i.id)}" data-max="1100" alt="Fundus"><p class="small muted" style="margin:.6rem 0 0">${esc(i.original_filename || '')} · ${i.width}×${i.height}px</p></div>
    <div class="card"><h4>Image quality</h4><div class="chips">${qBadge(q.status)}${aBadge(i.analysis_status)}${rerun}</div>${q.issues.length ? `<ul class="issues">${q.issues.map(x => `<li>${esc(x.message)}</li>`).join('')}</ul>` : ''}${m}</div></div>
    <div><div class="card"><h4>AI result</h4>${ai}</div>${gcCard}<div class="card"><h4>Doctor review</h4>${reviews}${form}</div></div></div>`;
  hydrate($('#modal'));
}

/* ============ doctor: patients ============ */
async function viewPatients({q = '', page = 1} = {}) {
  const r = await api('/patients', {params: {q, page, size: 15}});
